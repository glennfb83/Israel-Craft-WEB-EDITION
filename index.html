<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IsraelCraft</title>
<style>
:root{--panel:#0b1726e8;--line:#ffffff38;--ink:#f7fbff}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#162536;color:var(--ink);font:14px system-ui,sans-serif}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}.panel{background:linear-gradient(145deg,#13243af2,#07111ef2);border:1px solid var(--line);box-shadow:0 8px 26px #0007;backdrop-filter:blur(8px);border-radius:14px}#top{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.resources{padding:8px 12px}.brand{display:flex;flex-direction:column}.brand small{color:#ffd166;font-weight:700}.brand strong{font-size:1.2rem}.resources{display:flex;gap:10px;align-items:center}.pill{white-space:nowrap}.pill b{color:#ffd166}#status{position:fixed;z-index:2;top:max(78px,12vh);left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));padding:8px 14px;text-align:center;pointer-events:none}#bottom{position:fixed;z-index:2;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:12px;pointer-events:none}.controls,.help{pointer-events:auto;padding:10px}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.move-pad{width:126px;height:92px;position:relative;flex:none}.move-pad button{position:absolute;width:40px;height:40px;border:1px solid #fff5;border-radius:10px;background:#24405dcc;color:white;font-size:20px;touch-action:none}.move-pad .up{left:43px;top:0}.move-pad .left{left:0;top:43px}.move-pad .down{left:43px;top:43px}.move-pad .right{left:86px;top:43px}button{color:var(--ink);background:#24405d;border:1px solid #fff4;border-radius:9px;padding:9px 11px;font:inherit;cursor:pointer}button:active{background:#3a6b8c;transform:translateY(1px)}#dialog{display:none;position:fixed;z-index:3;left:50%;bottom:170px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));padding:14px 16px}.dialog-head{display:flex;justify-content:space-between;font-weight:700;color:#ffd166}.dialog-head button{padding:2px 9px}.dialog-text{margin-top:8px}@media(max-width:720px){#top{align-items:flex-start}.resources{font-size:12px;gap:5px}.help{display:none}#bottom{justify-content:center}.controls{justify-content:center}.controls>[data-build],.full{display:none}}
</style>
</head>
<body><div id="app">
<canvas id="game" aria-label="IsraelCraft village game"></canvas>
<header id="top"><div class="panel brand"><small>⛏️ IsraelCraft</small><strong>NPC Village</strong></div><div class="panel resources"><span class="pill">🪵 <b id="wood">8</b></span><span class="pill">🪨 <b id="stone">7</b></span><span class="pill">🌾 <b id="wheat">5</b></span></div></header>
<div id="status" class="panel">Use WASD, arrow keys, or the buttons to move. Press E or Space near an NPC.</div>
<div id="dialog" class="panel"><div class="dialog-head"><span id="dialog-name"></span><button id="close-dialog">×</button></div><div class="dialog-text" id="dialog-text"></div></div>
<footer id="bottom"><div class="panel controls"><div class="move-pad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><button id="talk">✋ Talk</button><button class="full" id="fullscreen">⛶ Fullscreen</button></div><div class="panel help"><b>Move:</b> WASD / arrows<br><b>Talk:</b> E, Space, or button</div></footer>
</div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),dialog=document.getElementById('dialog');
const keys=Object.create(null),world={size:32,tiles:[],npcs:[{name:'Flippy',x:8,y:8,line:'Going flippy? To be frank, happens to the best of us.'},{name:'Frank',x:24,y:13,line:'To be frank, happens to the best of us. Keep exploring IsraelCraft!'},{name:'Maya',x:16,y:24,line:'Welcome to IsraelCraft! The whole map is yours to explore.'}]};
const player={x:16,y:16,r:.27,speed:6};let view={w:innerWidth,h:innerHeight,dpr:1,tile:32};
function resize(){view.w=innerWidth;view.h=innerHeight;view.dpr=Math.min(devicePixelRatio||1,2);canvas.width=view.w*view.dpr;canvas.height=view.h*view.dpr;ctx.setTransform(view.dpr,0,0,view.dpr,0,0);view.tile=Math.max(18,Math.min(46,Math.min(view.w,view.h)/12))}addEventListener('resize',resize);
function makeWorld(){for(let y=0;y<world.size;y++){world.tiles[y]=[];for(let x=0;x<world.size;x++){const edge=x<1||y<1||x>=world.size-1||y>=world.size-1;const n=Math.sin(x*.7)+Math.cos(y*.55)+Math.sin((x+y)*.3);world.tiles[y][x]=edge?'water':n<-1.25?'rock':n>1.35?'sand':'grass'}}world.npcs.forEach(n=>world.tiles[n.y][n.x]='grass');world.tiles[16][16]='grass'}
function blocked(x,y){const t=world.tiles[Math.floor(y)]?.[Math.floor(x)];return !t||t==='water'||t==='rock'}
function canStand(x,y){const r=player.r;return !blocked(x-r,y-r)&&!blocked(x+r,y-r)&&!blocked(x-r,y+r)&&!blocked(x+r,y+r)}
function move(dt){let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);if(!x&&!y)return;const l=Math.hypot(x,y);x=x/l*player.speed*dt;y=y/l*player.speed*dt;let nx=player.x+x,ny=player.y+y;if(canStand(nx,player.y))player.x=nx;if(canStand(player.x,ny))player.y=ny}
function nearest(){let best=null,d=2;for(const n of world.npcs){const q=Math.hypot(player.x-n.x-.5,player.y-n.y-.5);if(q<d){d=q;best=n}}return best}
function talk(){const n=nearest();if(!n){status.textContent='Move closer to an NPC to talk.';return}document.getElementById('dialog-name').textContent=n.name;document.getElementById('dialog-text').textContent=n.line;dialog.style.display='block';status.textContent='Talking to '+n.name+'.'}
function key(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key))e.preventDefault();keys[e.code]=down;if(down&&(e.code==='KeyE'||e.code==='Space'))talk()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));document.getElementById('close-dialog').onclick=()=>dialog.style.display='none';document.getElementById('talk').onclick=talk;
document.querySelectorAll('[data-move]').forEach(b=>{const code={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.move];const on=e=>{e.preventDefault();keys[code]=true};const off=e=>{e.preventDefault();keys[code]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();
function draw(){ctx.clearRect(0,0,view.w,view.h);const tile=view.tile,cx=view.w/2-player.x*tile,cy=view.h/2-player.y*tile;ctx.fillStyle='#79b9e0';ctx.fillRect(0,0,view.w,view.h);for(let y=0;y<world.size;y++)for(let x=0;x<world.size;x++){const t=world.tiles[y][x],px=cx+x*tile,py=cy+y*tile;ctx.fillStyle={grass:'#63ad55',sand:'#d2b367',rock:'#657482',water:'#3696bd'}[t];ctx.fillRect(px,py,tile+1,tile+1);ctx.strokeStyle='#ffffff12';ctx.strokeRect(px,py,tile, tile)}for(const n of world.npcs){const px=cx+(n.x+.5)*tile,py=cy+(n.y+.5)*tile;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(px,py,tile*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#102033';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(n.name,px,py-tile*.4)}const px=view.w/2,py=view.h/2;ctx.fillStyle='#e85d75';ctx.beginPath();ctx.arc(px,py,tile*.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-tile*.1,py-tile*.05,3,0,Math.PI*2);ctx.arc(px+tile*.1,py-tile*.05,3,0,Math.PI*2);ctx.fill()}
makeWorld();resize();let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
