<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>IsraelCraft: Negev Bloom</title>
  <style>
    :root {
      --bg1: #79c9f0;
      --bg2: #c8f0ca;
      --bg3: #203b2b;
      --panel: rgba(10, 20, 26, 0.82);
      --panel-2: rgba(18, 32, 39, 0.82);
      --line: rgba(255, 255, 255, 0.18);
      --text: #eef6ff;
      --muted: #dfeefc;
      --gold: #ffd166;
      --blue: #7dd3fc;
      --green: #75d979;
      --sand: #f1d78a;
      --red: #ff7d7d;
      --shadow: rgba(0, 0, 0, 0.26);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    #game-shell {
      width: min(1120px, 100%);
      background: rgba(6, 12, 16, 0.62);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 24px 44px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, rgba(18, 28, 37, 0.9), rgba(9, 18, 24, 0.9));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    #title-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 209, 102, 0.18), rgba(125, 211, 252, 0.12));
      border: 1px solid rgba(255, 209, 102, 0.4);
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 3px 12px rgba(255, 209, 102, 0.28);
    }

    #resources {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .pill b {
      color: white;
      font-weight: 900;
      font-size: 1rem;
    }

    #status-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      background: rgba(8, 16, 22, 0.55);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }

    #status {
      flex: 1 1 260px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      min-height: 1.5em;
    }

    #status.win {
      color: #d9f9d8;
      text-shadow: 0 0 12px rgba(117, 217, 121, 0.6);
    }

    #objective {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.92;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      min-height: 330px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #7bc9ef 0%, #b8e6d2 48%, #d3f1b1 100%);
      box-shadow: inset 0 0 18px rgba(255,255,255,0.14);
      touch-action: none;
      cursor: crosshair;
    }

    #controls {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, rgba(16, 28, 33, 0.88), rgba(9, 18, 22, 0.9));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      color: var(--text);
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 9px 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(125, 211, 252, 0.65);
      box-shadow: 0 8px 22px rgba(63, 164, 207, 0.18);
    }

    button.active {
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.22), rgba(255, 209, 102, 0.12));
      border-color: rgba(255, 209, 102, 0.7);
      box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.18), 0 10px 18px rgba(255, 209, 102, 0.12);
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .legend span {
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
    }

    @media (max-width: 700px) {
      #status-panel,
      #controls,
      #hud {
        justify-content: center;
      }

      #objective,
      .legend {
        width: 100%;
        justify-content: center;
        text-align: center;
      }

      canvas {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <header id="hud">
      <div id="title-wrap">
        <div class="badge">IsraelCraft</div>
        <h1>Negev Bloom</h1>
      </div>
      <div id="resources">
        <span class="pill">🌳 Wood <b id="wood">0</b></span>
        <span class="pill">🪨 Stone <b id="stone">0</b></span>
        <span class="pill">🌾 Wheat <b id="wheat">0</b></span>
        <span class="pill">💧 Water <b id="water">0</b></span>
        <span class="pill">⚙️ Iron <b id="iron">0</b></span>
      </div>
    </header>

    <div id="status-panel">
      <div id="status">Build a thriving kibbutz in the Negev.</div>
      <div id="objective">Goal: Camp + Farm + Workshop + Well</div>
    </div>

    <canvas id="game" width="1000" height="620" aria-label="3D voxel building game set in Israel"></canvas>

    <div id="controls">
      <div class="buttons">
        <button class="build active" data-type="camp">⛺ Camp</button>
        <button class="build" data-type="farm">🌾 Farm</button>
        <button class="build" data-type="workshop">⚙️ Workshop</button>
        <button class="build" data-type="well">💧 Well</button>
      </div>
      <div class="legend">
        <span>Move: WASD</span>
        <span>Gather: E / Space</span>
        <span>Turn: F</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const ui = {
        status: document.getElementById('status'),
        wood: document.getElementById('wood'),
        stone: document.getElementById('stone'),
        wheat: document.getElementById('wheat'),
        water: document.getElementById('water'),
        iron: document.getElementById('iron')
      };

      const W = 22;
      const H = 16;
      const T = 34;
      const TAU = Math.PI * 2;

      const input = {
        keys: Object.create(null),
        mouse: null,
        drag: false,
        lastX: 0
      };

      const player = {
        x: 3.5,
        y: 3.5,
        dir: 0,
        speed: 4.6,
        inventory: { wood: 8, stone: 7, wheat: 5, water: 6, iron: 3 }
      };

      const state = {
        yaw: 0.8,
        selected: 'camp',
        won: false,
        time: 0
      };

      const world = {
        tiles: [],
        resources: [],
        buildings: []
      };

      const BUILD = {
        camp: { label: 'Camp', cost: { wood: 5, stone: 4, wheat: 2 } },
        farm: { label: 'Farm', cost: { wood: 6, stone: 4, wheat: 5, water: 2 } },
        workshop: { label: 'Workshop', cost: { wood: 9, stone: 8, iron: 4, water: 2 } },
        well: { label: 'Well', cost: { wood: 3, stone: 5, water: 3 } }
      };

      const tileColors = {
        grass: ['#74c16d', '#4e9d4d', '#2f6b38'],
        sand: ['#efda94', '#d0b565', '#96783c'],
        rock: ['#b4bec7', '#7d8894', '#495768'],
        water: ['#69d0ef', '#3aa5d3', '#245f93']
      };

      function status(text) {
        ui.status.textContent = text;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function makeWorld() {
        for (let y = 0; y < H; y++) {
          world.tiles[y] = [];
          for (let x = 0; x < W; x++) {
            let noise = Math.sin(x * 0.72) + Math.cos(y * 0.78) + Math.sin((x + y) * 0.58);
            let type = noise < -1.3 ? 'rock' : (x > 15 && y > 9 ? 'sand' : 'grass');

            if ((x > 16 && y > 11 && y < 15) || (x < 4 && y > 10 && y < 15)) {
              type = 'sand';
            }

            if ((x > 18 && y > 10) || (x < 2 && y > 12)) {
              type = 'water';
            }

            if (y < 2 || x < 1 || x > W - 2) {
              type = 'rock';
            }

            world.tiles[y][x] = type;
          }
        }

        const addResource = (type, count) => {
          let placed = 0;
          while (placed < count) {
            const x = 1 + Math.floor(Math.random() * (W - 2));
            const y = 1 + Math.floor(Math.random() * (H - 2));
            const tile = world.tiles[y][x];

            if (tile === 'water' || tile === 'rock') continue;
            if (world.resources.some(r => r.x === x && r.y === y)) continue;

            world.resources.push({ x, y, type, amount: 2 + Math.floor(Math.random() * 4) });
            placed++;
          }
        };

        addResource('tree', 15);
        addResource('stone', 11);
        addResource('wheat', 12);
        addResource('water', 8);
        addResource('iron', 7);
      }

      function updateHUD() {
        Object.keys(player.inventory).forEach(key => {
          const element = ui[key];
          if (element) element.textContent = String(player.inventory[key]);
        });
      }

      function nearResource() {
        let best = null;
        let bestDist = Infinity;

        for (const r of world.resources) {
          const dist = Math.hypot(player.x - (r.x + 0.5), player.y - (r.y + 0.5));
          if (dist < bestDist && dist < 1.5) {
            bestDist = dist;
            best = r;
          }
        }

        return best;
      }

      function gather() {
        const target = nearResource();
        if (!target) {
          status('Move closer to a tree, rock, crop, water, or iron vein.');
          return;
        }

        const resourceMap = {
          tree: 'wood',
          stone: 'stone',
          wheat: 'wheat',
          water: 'water',
          iron: 'iron'
        };

        const resourceAmount = target.amount > 0 ? 2 + Math.floor(Math.random() * 2) : 0;
        target.amount -= 1;

        if (target.amount <= 0) {
          world.resources = world.resources.filter(r => r !== target);
        }

        const key = resourceMap[target.type];
        if (key) {
          player.inventory[key] = (player.inventory[key] || 0) + resourceAmount;
          status(`Gathered ${resourceAmount} ${key}.`);
        }

        updateHUD();
      }

      function has(cost) {
        return Object.entries(cost).every(([key, value]) => (player.inventory[key] || 0) >= value);
      }

      function placeBuildingOnTile(tx, ty) {
        const type = state.selected;
        if (!type || tx < 0 || ty < 0 || tx >= W || ty >= H) return;

        const data = BUILD[type];
        if (!has(data.cost)) {
          status(`You need more resources to build a ${data.label}.`);
          return;
        }

        if (world.tiles[ty][tx] === 'water' || world.tiles[ty][tx] === 'rock') {
          status('That tile is blocked. Place on grass or sand.');
          return;
        }

        if (world.buildings.some(b => b.x === tx && b.y === ty)) {
          status('A structure is already here.');
          return;
        }

        Object.entries(data.cost).forEach(([key, value]) => {
          player.inventory[key] = (player.inventory[key] || 0) - value;
        });

        world.buildings.push({ x: tx, y: ty, type });
        status(`${data.label} built successfully.`);
        updateHUD();
        checkWin();
      }

      function checkWin() {
        if (state.won) return;

        const builtTypes = new Set(world.buildings.map(b => b.type));
        const goal = ['camp', 'farm', 'workshop', 'well'];

        if (
          goal.every(type => builtTypes.has(type)) &&
          Object.values(player.inventory).every(value => value >= 3)
        ) {
          state.won = true;
          ui.status.classList.add('win');
          status('Victory! The Negev blooms and your kibbutz is thriving.');
        }
      }

      function move(dt) {
        let axisX = 0;
        let axisY = 0;

        if (input.keys.KeyD || input.keys.ArrowRight) axisX += 1;
        if (input.keys.KeyA || input.keys.ArrowLeft) axisX -= 1;
        if (input.keys.KeyS || input.keys.ArrowDown) axisY += 1;
        if (input.keys.KeyW || input.keys.ArrowUp) axisY -= 1;

        if (axisX || axisY) {
          const length = Math.hypot(axisX, axisY) || 1;
          const moveX = (axisX / length) * player.speed * dt;
          const moveY = (axisY / length) * player.speed * dt;

          const nextX = clamp(player.x + moveX, 0.5, W - 1.5);
          const nextY = clamp(player.y + moveY, 0.5, H - 1.5);

          const currentTile = world.tiles[Math.floor(player.y)][Math.floor(player.x)];
          const targetTileX = world.tiles[Math.floor(player.y)][Math.floor(nextX)];
          const targetTileY = world.tiles[Math.floor(nextY)][Math.floor(player.x)];

          if (targetTileX !== 'water' && targetTileX !== 'rock') player.x = nextX;
          if (targetTileY !== 'water' && targetTileY !== 'rock') player.y = nextY;

          if (currentTile === 'water') {
            player.x = clamp(player.x, 0.6, W - 1.4);
            player.y = clamp(player.y, 0.6, H - 1.4);
          }
        }
      }

      function project(x, y, z = 0) {
        const c = Math.cos(state.yaw);
        const s = Math.sin(state.yaw);
        const rx = x * c - y * s;
        const ry = x * s + y * c;
        return {
          x: canvas.width / 2 + (rx - ry) * T * 1.08,
          y: canvas.height * 0.62 + (rx + ry) * T * 0.54 - z * T
        };
      }

      function poly(points, color, stroke = 'rgba(0,0,0,0.16)') {
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }

      function cube(x, y, z, h, colors) {
        const p = project(x, y, z);
        const q = project(x + 1, y, z);
        const r = project(x + 1, y + 1, z);
        const s = project(x, y + 1, z);

        const a = project(x, y, z - h);
        const b = project(x + 1, y, z - h);
        const c = project(x + 1, y + 1, z - h);
        const d = project(x, y + 1, z - h);

        poly([p, q, r, s], colors[0]);
        poly([a, b, c, d], colors[1]);
        poly([d, c, r, s], colors[2]);
        poly([a, b, q, p], colors[3]);
      }

      function drawGround() {
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const tile = world.tiles[y][x];
            cube(x, y, 0, 0.34, tileColors[tile]);
          }
        }
      }

      function drawResource(resource) {
        const x = resource.x + 0.5;
        const y = resource.y + 0.5;

        if (resource.type === 'tree') {
          cube(resource.x + 0.18, resource.y + 0.18, 0.3, 0.65, ['#4dae5c', '#2b7d3d', '#1c5d2a', '#94d45d']);
          cube(resource.x + 0.34, resource.y + 0.34, 0.8, 0.5, ['#8fe67c', '#5dc15d', '#3fa948', '#9ac76d']);
        } else if (resource.type === 'stone') {
          cube(resource.x + 0.25, resource.y + 0.25, 0.2, 0.45, ['#b7c0c9', '#8d97a2', '#67737d', '#9aa7b5']);
        } else if (resource.type === 'wheat') {
          cube(resource.x + 0.1, resource.y + 0.1, 0.3, 0.45, ['#b9d85e', '#7fb63b', '#5d8b2d', '#d5ef8b']);
        } else if (resource.type === 'water') {
          cube(resource.x + 0.2, resource.y + 0.2, 0.2, 0.42, ['#8ad9f9', '#61c1ef', '#2c8bc4', '#d0f3ff']);
        } else if (resource.type === 'iron') {
          cube(resource.x + 0.2, resource.y + 0.2, 0.2, 0.52, ['#c9d1d9', '#8c8f97', '#5a5f69', '#e2e6eb']);
        }
      }

      function drawBuilding(building) {
        const colors = {
          camp: ['#f2c27d', '#bd8248', '#8d5b32', '#f4d69d'],
          farm: ['#b7db7a', '#7ea64a', '#597d2e', '#d8ef9a'],
          workshop: ['#c7d0d8', '#909ca7', '#5d6975', '#dfeaf3'],
          well: ['#7fd8ff', '#4ca2c5', '#285d79', '#bff0ff']
        };

        cube(building.x + 0.12, building.y + 0.12, 0.25, 0.8, colors[building.type]);
      }

      function drawPlayer() {
        const p = project(player.x, player.y);
        ctx.beginPath();
        ctx.fillStyle = '#f7d0a1';
        ctx.arc(p.x, p.y - 28, 9, 0, TAU);
        ctx.fill();

        const torsoColors = ['#5aa1e8', '#2a6fc0', '#1b4e9d', '#6bb6ff'];
        cube(player.x - 0.18, player.y - 0.18, 0.25, 0.9, torsoColors);
      }

      function getPointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (canvas.width / rect.width);
        const y = (event.clientY - rect.top) * (canvas.height / rect.height);
        return { x, y };
      }

      function mouseTile() {
        if (!input.mouse) return null;

        let best = null;
        let bestDistance = Infinity;

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const center = project(x + 0.5, y + 0.5);
            const distance = Math.hypot(input.mouse.x - center.x, input.mouse.y - center.y);
            if (distance < bestDistance) {
              bestDistance = distance;
              best = { x, y };
            }
          }
        }

        return best;
      }

      function drawPlacementHighlight() {
        const cell = mouseTile();
        if (!cell) return;

        const cost = BUILD[state.selected].cost;
        const canBuild = has(cost);
        const valid = world.tiles[cell.y][cell.x] !== 'water' && world.tiles[cell.y][cell.x] !== 'rock' && !world.buildings.some(b => b.x === cell.x && b.y === cell.y);

        const p = project(cell.x, cell.y, 0.25);
        const q = project(cell.x + 1, cell.y, 0.25);
        const r = project(cell.x + 1, cell.y + 1, 0.25);
        const s = project(cell.x, cell.y + 1, 0.25);

        poly([p, q, r, s], valid ? (canBuild ? 'rgba(125,211,252,0.46)' : 'rgba(255,125,125,0.38)') : 'rgba(255,255,255,0.08)', 'rgba(255,255,255,0.24)');
      }

      function drawSkyGlow() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#7ecaf0');
        sky.addColorStop(0.58, '#bde7d4');
        sky.addColorStop(1, '#d8f6b7');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const sun = ctx.createRadialGradient(canvas.width * 0.77, canvas.height * 0.18, 10, canvas.width * 0.77, canvas.height * 0.18, 110);
        sun.addColorStop(0, 'rgba(255, 243, 170, 1)');
        sun.addColorStop(0.35, 'rgba(255, 209, 102, 0.9)');
        sun.addColorStop(1, 'rgba(255, 209, 102, 0)');
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function draw() {
        drawSkyGlow();
        drawGround();

        for (const resource of world.resources) {
          drawResource(resource);
        }

        for (const building of world.buildings) {
          drawBuilding(building);
        }

        drawPlayer();
        drawPlacementHighlight();
      }

      function loop(now) {
        const dt = Math.min((now - (loop.last || now)) / 1000, 0.05);
        loop.last = now;
        state.time += dt;
        move(dt);
        draw();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('pointermove', event => {
        const pos = getPointerPosition(event);
        input.mouse = pos;

        if (input.drag) {
          state.yaw += (event.clientX - input.lastX) * 0.012;
          input.lastX = event.clientX;
        }
      });

      canvas.addEventListener('pointerdown', event => {
        const pos = getPointerPosition(event);
        input.mouse = pos;
        input.drag = true;
        input.lastX = event.clientX;

        const cell = mouseTile();
        if (cell) {
          placeBuildingOnTile(cell.x, cell.y);
        }
      });

      canvas.addEventListener('pointerup', () => {
        input.drag = false;
      });

      canvas.addEventListener('pointerleave', () => {
        input.drag = false;
      });

      window.addEventListener('keydown', event => {
        input.keys[event.code] = true;

        if (['KeyE', 'Space'].includes(event.code) && !event.repeat) {
          gather();
        }

        if (event.code === 'KeyF' && !event.repeat) {
          state.yaw += Math.PI / 2;
        }
      });

      window.addEventListener('keyup', event => {
        input.keys[event.code] = false;
      });

      document.querySelectorAll('.build').forEach(button => {
        button.addEventListener('click', () => {
          state.selected = button.dataset.type;
          document.querySelectorAll('.build').forEach(node => node.classList.toggle('active', node === button));
          status(`Selected: ${BUILD[state.selected].label}. Click the map to build.`);
        });
      });

      makeWorld();
      updateHUD();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
