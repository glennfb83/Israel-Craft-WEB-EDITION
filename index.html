<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IsraelCraft</title>
<style>
:root{--panel:#182536ee;--line:#d9f0ff66;--ink:#f7fbff;--gold:#ffd166}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#162536;color:var(--ink);font:14px system-ui,sans-serif}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}.panel{background:var(--panel);border:2px solid var(--line);box-shadow:5px 5px 0 #07111ecc;border-radius:2px}.brand{padding:8px 12px}.brand small,.brand strong{display:block}.brand small{color:var(--gold);font-weight:700}.brand strong{font-size:18px}.controls{display:flex;align-items:center;gap:10px;padding:10px}.move-pad{width:118px;height:92px;display:grid;grid-template:repeat(3,30px)/repeat(3,36px);justify-content:center;align-content:center}.move-pad button{color:#fff;background:#29435dcc;border:2px solid #d9f0ff55;border-radius:2px;font-size:17px;touch-action:none}.move-pad .up{grid-area:1/2}.move-pad .left{grid-area:2/1}.move-pad .down{grid-area:2/2}.move-pad .right{grid-area:2/3}.controls>button{color:#fff;background:#29435d;border:2px solid #d9f0ff55;border-radius:2px;padding:10px;cursor:pointer}.controls>button:active,.move-pad button:active{background:#527b98}.help{padding:10px 12px;line-height:1.45}#top{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;pointer-events:none}#bottom{position:fixed;z-index:2;bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:end;gap:10px;pointer-events:none}.controls,.help{pointer-events:auto}#status{position:fixed;z-index:2;top:76px;left:50%;transform:translateX(-50%);padding:8px 12px;max-width:calc(100% - 24px);text-align:center;pointer-events:none}#minimap{position:fixed;z-index:2;top:76px;right:max(10px,env(safe-area-inset-right));width:150px;height:150px;border:2px solid #d9f0ff99;box-shadow:4px 4px 0 #07111ecc;image-rendering:pixelated;background:#0b1726}#dialog{display:none;position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));padding:14px}.dialog-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--gold)}.dialog-head button{color:#fff;background:none;border:0;font-size:24px;cursor:pointer}.dialog-text{margin-top:10px;line-height:1.5}@media(max-width:720px){.help{display:none}.full{display:none}#minimap{width:124px;height:124px;top:74px}}
</style>
</head>
<body><div id="app">
<canvas id="game" aria-label="IsraelCraft village game"></canvas>
<header id="top"><div class="panel brand"><small>⛏️ IsraelCraft</small><strong>NPC Village</strong></div></header>
<canvas id="minimap" width="150" height="150" aria-label="Village minimap"></canvas>
<div id="status" class="panel">WASD / arrows move · drag to look · E or Space talks</div>
<div id="dialog" class="panel"><div class="dialog-head"><span id="dialog-name"></span><button id="close-dialog">×</button></div><div class="dialog-text" id="dialog-text"></div></div>
<footer id="bottom"><div class="panel controls"><div class="move-pad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><button id="talk">✋ Talk</button><button class="full" id="fullscreen">⛶ Fullscreen</button></div><div class="panel help"><b>Look:</b> drag screen / mouse<br><b>Find:</b> yellow NPC dots on map</div></footer>
</div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),mini=document.getElementById('minimap'),mctx=mini.getContext('2d'),status=document.getElementById('status'),dialog=document.getElementById('dialog');
const keys=Object.create(null),world={size:32,tiles:[],npcs:[{name:'Flippy',x:8,y:8,line:'Going flippy? To be frank, happens to the best of us.'},{name:'Frank',x:24,y:13,line:'To be frank, happens to the best of us. Keep exploring IsraelCraft!'},{name:'Maya',x:16,y:24,line:'Welcome to IsraelCraft! The whole map is yours to explore.'}]};
const player={x:16.5,y:16.5,r:.27,speed:4.8,angle:0};let view={w:innerWidth,h:innerHeight,dpr:1};
function resize(){view.w=innerWidth;view.h=innerHeight;view.dpr=Math.min(devicePixelRatio||1,2);canvas.width=view.w*view.dpr;canvas.height=view.h*view.dpr;ctx.setTransform(view.dpr,0,0,view.dpr,0,0)}addEventListener('resize',resize);
function makeWorld(){for(let y=0;y<world.size;y++){world.tiles[y]=[];for(let x=0;x<world.size;x++){const edge=x<1||y<1||x>=world.size-1||y>=world.size-1,n=Math.sin(x*.7)+Math.cos(y*.55)+Math.sin((x+y)*.3);world.tiles[y][x]=edge?'water':n<-1.25?'rock':n>1.35?'sand':'grass'}}world.npcs.forEach(n=>world.tiles[n.y][n.x]='grass');world.tiles[16][16]='grass'}
function blocked(x,y){const t=world.tiles[Math.floor(y)]?.[Math.floor(x)];return !t||t==='water'||t==='rock'}
function canStand(x,y){const r=player.r;return !blocked(x-r,y-r)&&!blocked(x+r,y-r)&&!blocked(x-r,y+r)&&!blocked(x+r,y+r)}
function move(dt){let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),strafe=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(keys.KeyQ)player.angle-=2.5*dt;if(keys.KeyE&&!keys._eWas)talk();keys._eWas=!!keys.KeyE;if(!forward&&!strafe)return;const len=Math.hypot(forward,strafe);forward/=len;strafe/=len;const speed=player.speed*dt,dx=(Math.cos(player.angle)*forward-Math.sin(player.angle)*strafe)*speed,dy=(Math.sin(player.angle)*forward+Math.cos(player.angle)*strafe)*speed,nx=player.x+dx,ny=player.y+dy;if(canStand(nx,player.y))player.x=nx;if(canStand(player.x,ny))player.y=ny}
function nearest(){let best=null,d=2;for(const n of world.npcs){const q=Math.hypot(player.x-n.x-.5,player.y-n.y-.5);if(q<d){d=q;best=n}}return best}
function talk(){const n=nearest();if(!n){status.textContent='Move closer to an NPC to talk.';return}document.getElementById('dialog-name').textContent=n.name;document.getElementById('dialog-text').textContent=n.line;dialog.style.display='block';status.textContent='Talking to '+n.name+'.'}
function key(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key))e.preventDefault();keys[e.code]=down;if(down&&e.code==='Space')talk()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.getElementById('close-dialog').onclick=()=>dialog.style.display='none';document.getElementById('talk').onclick=talk;
const directions={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};document.querySelectorAll('[data-move]').forEach(b=>{const code=directions[b.dataset.move];const stop=e=>{e.preventDefault();keys[code]=false;b.releasePointerCapture?.(e.pointerId)};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[code]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(type=>b.addEventListener(type,stop))});document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();
let looking=false,lastLookX=0;canvas.addEventListener('pointerdown',e=>{looking=true;lastLookX=e.clientX;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!looking)return;player.angle+=(e.clientX-lastLookX)*.006;lastLookX=e.clientX});canvas.addEventListener('pointerup',()=>looking=false);canvas.addEventListener('pointercancel',()=>looking=false);
function tileAt(x,y){return world.tiles[Math.floor(y)]?.[Math.floor(x)]||'rock'}
function drawMini(){const s=mini.width/world.size;mctx.clearRect(0,0,mini.width,mini.height);for(let y=0;y<world.size;y++)for(let x=0;x<world.size;x++){mctx.fillStyle={grass:'#63ad55',sand:'#d2b367',rock:'#657482',water:'#3696bd'}[world.tiles[y][x]];mctx.fillRect(x*s,y*s,Math.ceil(s),Math.ceil(s))}for(const n of world.npcs){mctx.fillStyle='#ffd166';mctx.fillRect(n.x*s+2,n.y*s+2,Math.max(4,s-3),Math.max(4,s-3))}mctx.save();mctx.translate((player.x)*s,(player.y)*s);mctx.rotate(player.angle);mctx.fillStyle='#e85d75';mctx.beginPath();mctx.moveTo(0,-5);mctx.lineTo(4,5);mctx.lineTo(-4,5);mctx.closePath();mctx.fill();mctx.restore()}
function draw(){const w=view.w,h=view.h;ctx.clearRect(0,0,w,h);const horizon=h*.43,sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#6eb7df');sky.addColorStop(1,'#d6c28d');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);ctx.fillStyle='#5a8f48';ctx.fillRect(0,horizon,w,h-horizon);const fov=Math.PI/3,rays=Math.ceil(w/2),strip=w/rays,depth=[];for(let i=0;i<rays;i++){const camera=(i/rays-.5)*fov,angle=player.angle+camera,dx=Math.cos(angle),dy=Math.sin(angle);let d=0,hit='grass';while(d<30){d+=.035;const t=tileAt(player.x+dx*d,player.y+dy*d);if(t==='water'||t==='rock'||t==='sand'){hit=t;break}}const corrected=d*Math.cos(camera);depth[i]=corrected;const wall=Math.min(h*2,h/(corrected*.72)),top=horizon-wall/2;ctx.fillStyle={rock:'#657482',sand:'#d2b367',water:'#3696bd',grass:'#63ad55'}[hit];ctx.fillRect(i*strip,top,strip+1,wall);ctx.fillStyle='rgba(0,0,0,'+Math.min(.65,corrected/30)+')';ctx.fillRect(i*strip,top,strip+1,wall)}ctx.textAlign='center';for(const n of world.npcs){const vx=n.x+.5-player.x,vy=n.y+.5-player.y,dist=Math.hypot(vx,vy),rel=Math.atan2(Math.sin(Math.atan2(vy,vx)-player.angle),Math.cos(Math.atan2(vy,vx)-player.angle));if(Math.abs(rel)<fov*.55&&dist>.3){const sx=w/2+Math.tan(rel)/(Math.tan(fov/2))*w/2,ray=Math.max(0,Math.min(rays-1,Math.floor(sx/strip)));if(dist<depth[ray]-.08){const size=Math.min(h*.45,h/(dist*.8));ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(sx,horizon+size*.08,size*.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7b4b32';ctx.fillRect(sx-size*.13,horizon+size*.2,size*.26,size*.4);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText(n.name,sx,horizon-size*.2)}}}ctx.fillStyle='#fff';ctx.fillRect(w/2-7,horizon-1,14,2);ctx.fillRect(w/2-1,horizon-7,2,14);drawMini()}
makeWorld();resize();let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
