<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>IsraelCraft 3D</title>
  <style>
    :root{--panel:rgba(15,24,32,.88);--line:rgba(255,255,255,.18);--text:#f4f8ff;--gold:#ffd166;--blue:#80d8ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#83c9f0 0 42%,#203b2b 100%);font-family:system-ui,sans-serif;color:var(--text)}
    body{display:grid;place-items:center;padding:10px}#game-shell{width:min(1100px,100%);background:rgba(4,10,15,.7);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 20px 70px #0008}
    #hud,#controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}#hud{justify-content:space-between;margin-bottom:10px}
    #title{font-weight:900;letter-spacing:.12em;color:var(--gold);font-size:clamp(1.1rem,3vw,1.7rem)}#resources{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.pill{padding:4px 8px;border-radius:999px;background:#ffffff0d;font-size:.82rem;color:#bfd0df}.pill b{color:#fff;margin-left:3px}#status{color:var(--blue);font-weight:700;font-size:.88rem;margin-left:auto}
    canvas{display:block;width:100%;height:auto;min-height:300px;border:1px solid var(--line);border-radius:12px;background:#79bde0;cursor:crosshair;touch-action:none}
    #controls{margin-top:10px;justify-content:space-between}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid var(--line);background:#ffffff12;color:var(--text);border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}button:hover,button.active{background:#80d8ff2b;border-color:var(--blue)}#hint{color:#bfd0df;font-size:.84rem}kbd{background:#0007;border:1px solid #fff3;border-radius:4px;padding:1px 5px;color:#fff}
    @media(max-width:650px){#status{width:100%;margin:0}#hint{width:100%}canvas{min-height:260px}}
  </style>
</head>
<body>
<div id="game-shell">
  <header id="hud"><div id="title">IsraelCraft 3D</div><div id="resources"><span class="pill">Wood <b id="wood">0</b></span><span class="pill">Stone <b id="stone">0</b></span><span class="pill">Wheat <b id="wheat">0</b></span><span class="pill">Water <b id="water">0</b></span><span class="pill">Iron <b id="iron">0</b></span></div><div id="status">Explore, gather, build.</div></header>
  <canvas id="game" width="1000" height="620" aria-label="3D voxel game"></canvas>
  <div id="controls"><div class="buttons"><button class="build" data-type="camp">⛺ Camp</button><button class="build" data-type="farm">🌾 Farm</button><button class="build" data-type="workshop">🛠 Workshop</button><button class="build" data-type="well">💧 Well</button><button id="cancel">Cancel</button><button id="flip">↻ Flip view <kbd>F</kbd></button></div><div id="hint"><b>Move</b> WASD/arrows · <b>Gather</b> E or Space · <b>Build</b> click a tile · <b>Look</b> drag</div></div>
</div>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const W=22,H=16,T=32,TAU=Math.PI*2;
const ui={status:document.querySelector('#status'),wood:document.querySelector('#wood'),stone:document.querySelector('#stone'),wheat:document.querySelector('#wheat'),water:document.querySelector('#water'),iron:document.querySelector('#iron')};
const input={keys:Object.create(null),drag:false,lastX:0};
const player={x:3.5,y:3.5,dir:0,speed:4,inventory:{wood:0,stone:0,wheat:0,water:0,iron:0}};
const state={yaw:0,selected:null,won:false,time:0};
const world={tiles:[],resources:[],buildings:[]};
const BUILD={camp:{label:'Camp',cost:{wood:6,stone:4,wheat:2}},farm:{label:'Farm',cost:{wood:8,stone:4,wheat:4,water:2}},workshop:{label:'Workshop',cost:{wood:10,stone:8,iron:4,water:2}},well:{label:'Well',cost:{wood:5,stone:6,water:3}}};
const tileColors={grass:['#67b54f','#4e963e','#3d7735'],sand:['#e0c477','#c19d56','#9b783d'],rock:['#9aa7ad','#77848a','#59656c'],water:['#52bce7','#328cb6','#216985']};
function status(s){ui.status.textContent=s} function clamp(n,a,b){return Math.max(a,Math.min(b,n))} function key(x,y){return `${x},${y}`}
function makeWorld(){
  for(let y=0;y<H;y++){world.tiles[y]=[];for(let x=0;x<W;x++){let n=Math.sin(x*.8)+Math.cos(y*.7)+Math.sin((x+y)*.35);let t=n<-1.25?'rock':(x>16&&y>10||x<3&&y>11?'sand':'grass');if((x<2||x>19)&&y>6&&y<13)t='water';world.tiles[y][x]=t}}
  const add=(type,count)=>{let made=0;while(made<count){let x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));if(world.tiles[y][x]!=='water'&&!world.resources.some(r=>r.x===x&&r.y===y)&&Math.hypot(x-3,y-3)>3){world.resources.push({type,x,y,amount:type==='tree'?5:4});made++}}};
  add('tree',13);add('stone',10);add('wheat',11);add('water',8);add('iron',7);
}
function center(x,y){return{x:x+.5,y:y+.5}}
function updateHUD(){for(const k in ui)if(player.inventory[k]!=null)ui[k].textContent=player.inventory[k]}
function nearResource(){return world.resources.map(r=>({r,d:Math.hypot(player.x-(r.x+.5),player.y-(r.y+.5))})).filter(o=>o.d<1.35).sort((a,b)=>a.d-b.d)[0]}
function gather(){const found=nearResource();if(!found){status('Move close to a tree, rock, crop, water, or iron vein.');return}const r=found.r;r.amount--;const map={tree:'wood',stone:'stone',wheat:'wheat',water:'water',iron:'iron'};player.inventory[map[r.type]]++;if(r.amount<=0)world.resources=world.resources.filter(a=>a!==r);updateHUD();status(`Gathered ${map[r.type]}.`);checkWin()}
function has(cost){return Object.entries(cost).every(([k,v])=>player.inventory[k]>=v)}
function place(tx,ty){const type=state.selected;if(!type||tx<0||ty<0||tx>=W||ty>=H)return;const data=BUILD[type];if(!has(data.cost)){status(`Need more resources for a ${data.label}.`);return}if(world.tiles[ty][tx]==='water'||world.buildings.some(b=>Math.hypot(b.x-tx-.5,b.y-ty-.5)<1.3)){status('Choose an open land tile.');return}for(const [k,v] of Object.entries(data.cost))player.inventory[k]-=v;world.buildings.push({type,x:tx+.5,y:ty+.5});state.selected=null;document.querySelectorAll('.build').forEach(b=>b.classList.remove('active'));updateHUD();status(`${data.label} built!`);checkWin()}
function checkWin(){let types=new Set(world.buildings.map(b=>b.type));if(!state.won&&['camp','farm','workshop','well'].every(t=>types.has(t))&&Object.values(player.inventory).every(v=>v>=4)){state.won=true;status('Victory! Your settlement is thriving.')}}
function move(dt){let x=(input.keys.KeyD||input.keys.ArrowRight?1:0)-(input.keys.KeyA||input.keys.ArrowLeft?1:0),y=(input.keys.KeyS||input.keys.ArrowDown?1:0)-(input.keys.KeyW||input.keys.ArrowUp?1:0);if(!x&&!y)return;const l=Math.hypot(x,y);x/=l;y/=l;const c=Math.cos(state.yaw),s=Math.sin(state.yaw),nx=x*c-y*s,ny=x*s+y*c;const px=clamp(player.x+nx*player.speed*dt,.45,W-.45),py=clamp(player.y+ny*player.speed*dt,.45,H-.45);if(world.tiles[Math.floor(player.y)][Math.floor(px)]!=='water')player.x=px;if(world.tiles[Math.floor(py)][Math.floor(player.x)]!=='water')player.y=py;player.dir=Math.atan2(ny,nx)}
function project(x,y,z=0){const c=Math.cos(state.yaw),s=Math.sin(state.yaw),rx=x*c-y*s,ry=x*s+y*c;return{x:canvas.width/2+(rx-ry)*T*1.05,y:canvas.height*.62+(rx+ry)*T*.5-z*T}}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.strokeStyle='#0002';ctx.stroke()}
function cube(x,y,z,h,color){const p=project(x,y,z),q=project(x+1,y,z),r=project(x+1,y+1,z),s=project(x,y+1,z),top=[p,q,r,s],a=project(x,y,z-h),b=project(x+1,y,z-h),c=project(x+1,y+1,z-h),d=project(x,y+1,z-h);poly(top,color[0]);poly([s,r,c,d],color[1]);poly([p,s,d,a],color[2])}
function drawResource(r){const p=project(r.x+.5,r.y+.5);if(r.type==='tree'){cube(r.x+.25,r.y+.25,0,0.65,['#3e9d55','#276b3c','#24502f']);cube(r.x+.42,r.y+.42,.65,.55,['#65c85c','#3d963d','#2d7335'])}else if(r.type==='stone'||r.type==='iron')cube(r.x+.15,r.y+.15,0,.45,r.type==='iron'?['#e5edf2','#a9b7c0','#73818b']:['#aab4b8','#7c878d','#59656c']);else if(r.type==='wheat')for(let i=0;i<3;i++)cube(r.x+.15+i*.25,r.y+.2,0,.5,['#f4d35e','#c59b35','#947324']);else cube(r.x+.2,r.y+.2,0,.35,['#7cdbf4','#3fafd4','#257d9c'])}
function drawBuilding(b){const colors={camp:['#e7b66f','#b57942','#80512f'],farm:['#a4cf62','#6e9d40','#4d7734'],workshop:['#bbc6d0','#87929d','#5b6570'],well:['#79d9f1','#439aba','#28697e']};cube(b.x-.38,b.y-.38,0,.75,colors[b.type])}
function drawPlayer(){const p=project(player.x,player.y);ctx.fillStyle='#f5d0a0';ctx.beginPath();ctx.arc(p.x,p.y-25,9,0,TAU);ctx.fill();cube(player.x-.2,player.y-.2,0,.9,['#4e9af0','#2767b7','#1d4784']);ctx.fillStyle='#fff';ctx.fillRect(p.x-3,p.y-29,3,3);ctx.fillRect(p.x+4,p.y-29,3,3)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const sky=ctx.createLinearGradient(0,0,0,canvas.height);sky.addColorStop(0,'#81c9ed');sky.addColorStop(.58,'#b8e0ce');sky.addColorStop(.59,'#5c9b4a');sky.addColorStop(1,'#25472f');ctx.fillStyle=sky;ctx.fillRect(0,0,canvas.width,canvas.height);const items=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=project(x,y);items.push({d:p.y,type:'tile',x,y})}world.buildings.forEach(b=>items.push({d:project(b.x,b.y).y,type:'building',b}));world.resources.forEach(r=>items.push({d:project(r.x,r.y).y,type:'resource',r}));items.push({d:project(player.x,player.y).y,type:'player'});items.sort((a,b)=>a.d-b.d);for(const it of items){if(it.type==='tile'){const{x,y}=it,p=project(x,y),q=project(x+1,y),r=project(x+1,y+1),s=project(x,y+1);poly([p,q,r,s],tileColors[world.tiles[y][x]])}else if(it.type==='resource')drawResource(it.r);else if(it.type==='building')drawBuilding(it.b);else drawPlayer()}
  if(state.selected){const m=mouseTile();if(m){const p=project(m.x,m.y),q=project(m.x+1,m.y),r=project(m.x+1,m.y+1),s=project(m.x,m.y+1);poly([p,q,r,s],has(BUILD[state.selected].cost)?'#80d8ff55':'#ff6b6b55')}}ctx.fillStyle='#0008';ctx.fillRect(16,16,245,32);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText(`View: ${Math.round((state.yaw/Math.PI*180+360)%360)}°  •  F flips`,26,38);if(state.won){ctx.fillStyle='#000b';ctx.fillRect(canvas.width/2-210,canvas.height/2-48,420,96);ctx.fillStyle='#ffd166';ctx.font='900 28px system-ui';ctx.textAlign='center';ctx.fillText('VICTORY!',canvas.width/2,canvas.height/2);ctx.font='15px system-ui';ctx.fillStyle='#fff';ctx.fillText('Your IsraelCraft world is complete.',canvas.width/2,canvas.height/2+26);ctx.textAlign='left'}}
function mouseTile(){if(!input.mouse)return null;let best=null,dist=Infinity;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=project(x+.5,y+.5),d=Math.hypot(input.mouse.x-p.x,input.mouse.y-p.y);if(d<dist){dist=d;best={x,y}}}return dist<30?best:null}
function pointerPos(e){const r=canvas.getBoundingClientRect();input.mouse={x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointermove',e=>{pointerPos(e);if(input.drag){state.yaw+=(e.clientX-input.lastX)*.012;input.lastX=e.clientX}});canvas.addEventListener('pointerdown',e=>{pointerPos(e);input.drag=true;input.lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(input.drag&&Math.abs(e.clientX-input.lastX)<4&&state.selected){const m=mouseTile();if(m)place(m.x,m.y)}input.drag=false});
window.addEventListener('keydown',e=>{input.keys[e.code]=true;if(['KeyE','Space'].includes(e.code)&&!e.repeat)gather();if(e.code==='KeyF'&&!e.repeat)state.yaw+=Math.PI});window.addEventListener('keyup',e=>input.keys[e.code]=false);
document.querySelectorAll('.build').forEach(btn=>btn.addEventListener('click',()=>{state.selected=btn.dataset.type;document.querySelectorAll('.build').forEach(b=>b.classList.toggle('active',b===btn));status(`Selected ${BUILD[state.selected].label}. Click an open tile.`)}));document.querySelector('#cancel').addEventListener('click',()=>{state.selected=null;document.querySelectorAll('.build').forEach(b=>b.classList.remove('active'));status('Build mode canceled.')});document.querySelector('#flip').addEventListener('click',()=>state.yaw+=Math.PI);
makeWorld();updateHUD();let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;state.time+=dt;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
