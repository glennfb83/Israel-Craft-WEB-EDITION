<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IsraelCraft</title>
  <style>
    :root {
      --bg: #0b1118;
      --panel: rgba(13, 27, 34, 0.88);
      --panel-border: rgba(136, 179, 204, 0.35);
      --text: #ecf6ff;
      --muted: #a9bed2;
      --accent: #80d8ff;
      --gold: #ffd166;
      --green: #7ce38b;
      --amber: #ffad5a;
      --red: #ff6b6b;
      --wood: #7b4a2b;
      --stone: #8a93a6;
      --iron: #d7deea;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        linear-gradient(180deg, #09141d 0%, #0d1d29 40%, #081018 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    #game-shell {
      width: min(96vw, 1160px);
      background: rgba(8, 15, 21, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    #hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: rgba(11, 28, 37, 0.8);
      margin-bottom: 12px;
    }

    #title {
      font-size: clamp(1.1rem, 2vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 209, 102, 0.3);
    }

    #resource-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .resource-pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .resource-pill strong {
      color: var(--text);
      margin-left: 4px;
    }

    #status {
      min-width: 260px;
      text-align: right;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: #1d3c2d;
      image-rendering: auto;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.22);
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: rgba(10, 24, 31, 0.8);
    }

    #build-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(128, 216, 255, 0.45);
      background: rgba(128, 216, 255, 0.08);
    }

    button.active {
      background: rgba(128, 216, 255, 0.14);
      border-color: rgba(128, 216, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(128,216,255,0.3) inset;
    }

    #legend {
      color: var(--muted);
      font-size: 0.9rem;
    }

    #legend strong { color: var(--text); }
  </style>
</head>
<body>
  <div id="game-shell">
    <div id="hud">
      <div id="title">IsraelCraft</div>
      <div id="resource-bar">
        <div class="resource-pill">Wood <strong id="woodValue">0</strong></div>
        <div class="resource-pill">Stone <strong id="stoneValue">0</strong></div>
        <div class="resource-pill">Wheat <strong id="wheatValue">0</strong></div>
        <div class="resource-pill">Water <strong id="waterValue">0</strong></div>
        <div class="resource-pill">Iron <strong id="ironValue">0</strong></div>
      </div>
      <div id="status">Gather and build your settlement.</div>
    </div>

    <canvas id="gameCanvas" width="960" height="600"></canvas>

    <div id="controls">
      <div id="build-buttons">
        <button class="build-btn" data-type="camp">Build Camp</button>
        <button class="build-btn" data-type="farm">Build Farm</button>
        <button class="build-btn" data-type="workshop">Build Workshop</button>
        <button class="build-btn" data-type="well">Build Well</button>
        <button id="cancelBuild">Cancel</button>
      </div>

      <div id="legend">
        <strong>Move:</strong> WASD / Arrows • <strong>Gather:</strong> E • <strong>Place:</strong> Click map
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const statusEl = document.getElementById("status");
    const resourceEls = {
      wood: document.getElementById("woodValue"),
      stone: document.getElementById("stoneValue"),
      wheat: document.getElementById("wheatValue"),
      water: document.getElementById("waterValue"),
      iron: document.getElementById("ironValue"),
    };

    const tileSize = 32;
    const mapCols = 30;
    const mapRows = 18;

    const BUILDINGS = {
      camp: {
        label: "Camp",
        cost: { wood: 6, stone: 4, wheat: 2 }
      },
      farm: {
        label: "Farm",
        cost: { wood: 8, stone: 4, wheat: 4, water: 2 }
      },
      workshop: {
        label: "Workshop",
        cost: { wood: 10, stone: 8, iron: 4, water: 2 }
      },
      well: {
        label: "Well",
        cost: { wood: 5, stone: 6, water: 3 }
      }
    };

    const input = {
      keys: {},
      ePressed: false
    };

    const state = {
      time: 0,
      selectedBuild: null,
      win: false,
      dayPhase: "Morning"
    };

    const player = {
      x: 180,
      y: 180,
      radius: 13,
      speed: 150,
      inventory: {
        wood: 0,
        stone: 0,
        wheat: 0,
        water: 0,
        iron: 0
      }
    };

    const world = {
      tiles: [],
      resources: [],
      buildings: []
    };

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function tileAtWorld(x, y) {
      const tx = clamp(Math.floor(x / tileSize), 0, mapCols - 1);
      const ty = clamp(Math.floor(y / tileSize), 0, mapRows - 1);
      return { tx, ty };
    }

    function generateWorld() {
      for (let row = 0; row < mapRows; row++) {
        const arr = [];
        for (let col = 0; col < mapCols; col++) {
          const n = (Math.sin(col * 0.9) + Math.cos(row * 0.8));
          let type = "grass";
          if (n < -1.2) type = "rock";
          if ((col > 20 && row > 12) || (col < 5 && row > 11)) type = "sand";
          if ((col < 3 || col > 26) && row > 8 && row < 15) type = "water";
          arr.push(type);
        }
        world.tiles.push(arr);
      }

      const spawnResource = (type, x, y, amount = 4) => {
        world.resources.push({
          id: `${type}-${world.resources.length}-${Math.random().toString(16).slice(2, 8)}`,
          type,
          x,
          y,
          amount,
          color: getResourceColor(type)
        });
      };

      const trySpawn = (type, count) => {
        let placed = 0;
        while (placed < count) {
          const x = 50 + Math.random() * (canvas.width - 100);
          const y = 50 + Math.random() * (canvas.height - 100);
          const t = tileAtWorld(x, y);
          if (world.tiles[t.ty][t.tx] !== "water") {
            spawnResource(type, x, y, type === "tree" ? 5 : 4);
            placed++;
          }
        }
      };

      trySpawn("tree", 10);
      trySpawn("stone", 9);
      trySpawn("wheat", 10);
      trySpawn("water", 8);
      trySpawn("iron", 6);
    }

    function getResourceColor(type) {
      const colors = {
        tree: "#38a169",
        stone: "#a0aec0",
        wheat: "#e9c46a",
        water: "#4fc3f7",
        iron: "#dfe7f2"
      };
      return colors[type] || "#fff";
    }

    function updateHUD() {
      Object.entries(resourceEls).forEach(([key, el]) => {
        el.textContent = player.inventory[key];
      });
    }

    function hasResources(cost) {
      return Object.entries(cost).every(([type, amount]) => player.inventory[type] >= amount);
    }

    function spendResources(cost) {
      Object.entries(cost).forEach(([type, amount]) => {
        player.inventory[type] -= amount;
      });
    }

    function canBuildAt(tx, ty) {
      const wx = tx * tileSize + tileSize / 2;
      const wy = ty * tileSize + tileSize / 2;

      if (world.tiles[ty][tx] === "water") return false;

      const tooClose = world.buildings.some((b) => {
        const dx = b.x - wx;
        const dy = b.y - wy;
        return Math.hypot(dx, dy) < 54;
      });

      return !tooClose;
    }

    function placeBuilding(type, tx, ty) {
      const buildingData = BUILDINGS[type];
      if (!buildingData) return;

      if (!hasResources(buildingData.cost)) {
        setStatus(`Need more resources before building ${buildingData.label}.`);
        return;
      }

      if (!canBuildAt(tx, ty)) {
        setStatus("That spot is occupied or too close to another building.");
        return;
      }

      const x = tx * tileSize + tileSize / 2;
      const y = ty * tileSize + tileSize / 2;

      spendResources(buildingData.cost);
      world.buildings.push({
        type,
        x,
        y,
        label: buildingData.label
      });

      state.selectedBuild = null;
      document.querySelectorAll(".build-btn").forEach((btn) => btn.classList.remove("active"));
      setStatus(`${buildingData.label} placed successfully.`);
      checkWinCondition();
      updateHUD();
    }

    function gatherNearestResource() {
      let best = null;
      for (const resource of world.resources) {
        const dist = Math.hypot(player.x - resource.x, player.y - resource.y);
        if (dist <= 38 && (!best || dist < best.dist)) {
          best = { dist, resource };
        }
      }

      if (!best) {
        setStatus("No resource nearby. Move closer to a tree, rock, wheat patch, water source, or iron vein.");
        return;
      }

      const res = best.resource;
      if (res.amount <= 0) {
        world.resources = world.resources.filter((r) => r.id !== res.id);
        setStatus("That resource is depleted.");
        return;
      }

      res.amount -= 1;
      const gainMap = {
        tree: "wood",
        stone: "stone",
        wheat: "wheat",
        water: "water",
        iron: "iron"
      };

      const gained = gainMap[res.type];
      if (gained) {
        player.inventory[gained] += 1;
      }

      if (res.amount <= 0) {
        world.resources = world.resources.filter((r) => r.id !== res.id);
      }

      setStatus(`Gathered ${gained || "resource"} from a ${res.type}.`);
      updateHUD();
      checkWinCondition();
    }

    function checkWinCondition() {
      if (state.win) return;

      const counts = {};
      for (const b of world.buildings) {
        counts[b.type] = (counts[b.type] || 0) + 1;
      }

      const required = {
        camp: 1,
        farm: 1,
        workshop: 1,
        well: 1
      };

      const hasRequiredBuildings = Object.entries(required).every(([type, amount]) => (counts[type] || 0) >= amount);
      const hasResourcesToThrive =
        player.inventory.wood >= 10 &&
        player.inventory.stone >= 10 &&
        player.inventory.wheat >= 8 &&
        player.inventory.water >= 6 &&
        player.inventory.iron >= 4;

      if (hasRequiredBuildings && hasResourcesToThrive) {
        state.win = true;
        setStatus("VICTORY! Your settlement in IsraelCraft is thriving. You built a lasting home.");
      }
    }

    function handleKeyDown(event) {
      input.keys[event.code] = true;
      if (event.code === "KeyE" && !input.ePressed) {
        input.ePressed = true;
        gatherNearestResource();
      }
    }

    function handleKeyUp(event) {
      input.keys[event.code] = false;
      if (event.code === "KeyE") {
        input.ePressed = false;
      }
    }

    function update(dt) {
      const moveX = (input.keys.KeyD || input.keys.ArrowRight ? 1 : 0) - (input.keys.KeyA || input.keys.ArrowLeft ? 1 : 0);
      const moveY = (input.keys.KeyS || input.keys.ArrowDown ? 1 : 0) - (input.keys.KeyW || input.keys.ArrowUp ? 1 : 0);

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY) || 1;
        const dx = (moveX / len) * player.speed * dt;
        const dy = (moveY / len) * player.speed * dt;
        player.x = clamp(player.x + dx, player.radius, canvas.width - player.radius);
        player.y = clamp(player.y + dy, player.radius, canvas.height - player.radius);
      }

      state.time += dt;
      const cycle = (state.time % 60) / 60;
      if (cycle < 0.25) state.dayPhase = "Morning";
      else if (cycle < 0.5) state.dayPhase = "Afternoon";
      else if (cycle < 0.75) state.dayPhase = "Evening";
      else state.dayPhase = "Night";
    }

    function drawBackground() {
      ctx.fillStyle = "#1d3c2d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let row = 0; row < mapRows; row++) {
        for (let col = 0; col < mapCols; col++) {
          const x = col * tileSize;
          const y = row * tileSize;
          let color = "#3b7a50";

          if (world.tiles[row][col] === "sand") color = "#d7b66f";
          if (world.tiles[row][col] === "water") color = "#3a7ca5";
          if (world.tiles[row][col] === "rock") color = "#5e6b73";

          ctx.fillStyle = color;
          ctx.fillRect(x, y, tileSize, tileSize);

          ctx.strokeStyle = "rgba(255,255,255,0.04)";
          ctx.strokeRect(x + 0.5, y + 0.5, tileSize - 1, tileSize - 1);
        }
      }
    }

    function drawResource(resource) {
      const { type, x, y, amount } = resource;

      if (type === "tree") {
        ctx.fillStyle = "#4d3b2d";
        ctx.fillRect(x - 4, y + 8, 8, 18);
        ctx.beginPath();
        ctx.fillStyle = "#2d9f5f";
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.fillStyle = "#2d9f5f";
        ctx.arc(x - 12, y + 5, 10, 0, Math.PI * 2);
        ctx.arc(x + 12, y + 5, 10, 0, Math.PI * 2);
        ctx.arc(x, y - 12, 10, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === "stone") {
        ctx.fillStyle = "#8a93a6";
        ctx.beginPath();
        ctx.moveTo(x, y - 12);
        ctx.lineTo(x + 12, y);
        ctx.lineTo(x + 6, y + 12);
        ctx.lineTo(x - 8, y + 12);
        ctx.lineTo(x - 12, y);
        ctx.closePath();
        ctx.fill();
      } else if (type === "wheat") {
        ctx.strokeStyle = "#d4a017";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x - 10, y - 12, x, y - 22);
        ctx.moveTo(x + 8, y);
        ctx.quadraticCurveTo(x - 2, y - 12, x + 8, y - 22);
        ctx.stroke();

        ctx.fillStyle = "#9ebd3f";
        ctx.beginPath();
        ctx.arc(x - 6, y - 18, 5, 0, Math.PI * 2);
        ctx.arc(x + 8, y - 18, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === "water") {
        ctx.fillStyle = "#4fc3f7";
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.40)";
        ctx.fillRect(x - 4, y - 10, 8, 20);
      } else if (type === "iron") {
        ctx.fillStyle = "#dfe7f2";
        ctx.beginPath();
        ctx.moveTo(x, y - 14);
        ctx.lineTo(x + 11, y);
        ctx.lineTo(x, y + 14);
        ctx.lineTo(x - 11, y);
        ctx.closePath();
        ctx.fill();
      }

      if (amount > 0) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(x - 16, y - 22, 32, 8);
        ctx.fillStyle = "#fff";
        ctx.font = "10px sans-serif";
        ctx.fillText(String(amount), x - 4, y - 15);
      }
    }

    function drawBuilding(building) {
      const { x, y, type } = building;

      if (type === "camp") {
        ctx.fillStyle = "#d8a96a";
        ctx.fillRect(x - 18, y - 18, 36, 36);
        ctx.fillStyle = "#7b4a2b";
        ctx.fillRect(x - 8, y - 6, 16, 16);
      } else if (type === "farm") {
        ctx.fillStyle = "#78b66a";
        ctx.fillRect(x - 20, y - 20, 40, 40);
        ctx.strokeStyle = "#e7d98d";
        ctx.lineWidth = 2;
        for (let i = -14; i <= 14; i += 8) {
          ctx.beginPath();
          ctx.moveTo(x - 16, y + i);
          ctx.lineTo(x + 16, y + i);
          ctx.stroke();
        }
      } else if (type === "workshop") {
        ctx.fillStyle = "#8a93a6";
        ctx.fillRect(x - 22, y - 22, 44, 44);
        ctx.fillStyle = "#dfe7f2";
        ctx.fillRect(x - 8, y - 8, 16, 16);
      } else if (type === "well") {
        ctx.fillStyle = "#4fc3f7";
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e1f5fe";
        ctx.fillRect(x - 7, y - 15, 14, 24);
      }
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.fillStyle = "#f7d7a6";
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#3d4d5b";
      ctx.fillRect(player.x - 10, player.y - 18, 20, 8);

      ctx.fillStyle = "#4d8ae8";
      ctx.fillRect(player.x - 6, player.y + 10, 12, 8);
    }

    function drawPickupHint() {
      const nearby = world.resources.some((resource) => Math.hypot(player.x - resource.x, player.y - resource.y) <= 38);
      if (nearby) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(18, canvas.height - 36, 150, 24);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText("Press E to gather", 30, canvas.height - 18);
      }
    }

    function drawUI() {
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(18, 18, 270, 50);

      ctx.fillStyle = "#ecf6ff";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`Phase: ${state.dayPhase}`, 28, 38);

      ctx.fillStyle = "#ffd166";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(`Goal: Build camp + farm + workshop + well`, 28, 58);

      if (state.win) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(canvas.width / 2 - 260, canvas.height / 2 - 60, 520, 120);
        ctx.strokeStyle = "rgba(255,209,102,0.7)";
        ctx.strokeRect(canvas.width / 2 - 260, canvas.height / 2 - 60, 520, 120);

        ctx.fillStyle = "#ffd166";
        ctx.font = "900 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("WINNER", canvas.width / 2, canvas.height / 2 - 10);

        ctx.fillStyle = "#ecf6ff";
        ctx.font = "18px sans-serif";
        ctx.fillText("Your settlement has grown strong in IsraelCraft.", canvas.width / 2, canvas.height / 2 + 26);
        ctx.textAlign = "left";
      }
    }

    function draw() {
      drawBackground();

      for (const building of world.buildings) {
        drawBuilding(building);
      }

      for (const resource of world.resources) {
        drawResource(resource);
      }

      drawPlayer();
      drawPickupHint();
      drawUI();

      if (state.selectedBuild) {
        const mouse = getMousePosFromCanvas();
        if (mouse) {
          const tx = Math.floor(mouse.x / tileSize);
          const ty = Math.floor(mouse.y / tileSize);
          const centerX = tx * tileSize + tileSize / 2;
          const centerY = ty * tileSize + tileSize / 2;

          ctx.strokeStyle = "rgba(128,216,255,0.9)";
          ctx.lineWidth = 2;
          ctx.strokeRect(tx * tileSize, ty * tileSize, tileSize, tileSize);

          ctx.fillStyle = "rgba(128,216,255,0.22)";
          ctx.fillRect(tx * tileSize, ty * tileSize, tileSize, tileSize);

          ctx.fillStyle = "#fff";
          ctx.font = "bold 12px sans-serif";
          ctx.fillText(`Place ${BUILDINGS[state.selectedBuild].label}`, centerX - 34, centerY - 12);
        }
      }
    }

    function loop() {
      const now = performance.now();
      const last = loop.lastTime || now;
      const dt = (now - last) / 1000;
      loop.lastTime = now;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    function getMousePosFromCanvas() {
      const rect = canvas.getBoundingClientRect();
      const mouseX = (event.clientX - rect.left) * (canvas.width / rect.width);
      const mouseY = (event.clientY - rect.top) * (canvas.height / rect.height);
      return { x: mouseX, y: mouseY };
    }

    canvas.addEventListener("click", (event) => {
      if (state.win) return;

      if (!state.selectedBuild) return;

      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (canvas.width / rect.width);
      const y = (event.clientY - rect.top) * (canvas.height / rect.height);

      const tx = Math.floor(x / tileSize);
      const ty = Math.floor(y / tileSize);

      placeBuilding(state.selectedBuild, tx, ty);
    });

    document.querySelectorAll(".build-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const type = button.dataset.type;
        state.selectedBuild = type;
        document.querySelectorAll(".build-btn").forEach((btn) => {
          btn.classList.toggle("active", btn === button);
        });
        setStatus(`Selected: ${BUILDINGS[type].label}. Click a tile to place it.`);
      });
    });

    document.getElementById("cancelBuild").addEventListener("click", () => {
      state.selectedBuild = null;
      document.querySelectorAll(".build-btn").forEach((btn) => btn.classList.remove("active"));
      setStatus("Build selection canceled.");
    });

    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);

    generateWorld();
    updateHUD();
    setStatus("Gather resources and build a thriving settlement.");
    requestAnimationFrame(loop);
  </script>
