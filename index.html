<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IsraelCraft — Negev Bloom</title>
<style>
:root{--ink:#f7fbff;--muted:#d9edff;--line:#ffffff33;--panel:#07141dcc;--gold:#ffd166;--blue:#79d8ff;--green:#79df81;--danger:#ff8585}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(#70c8f0 0%,#c9efcc 55%,#1c392b 100%)}
#app{position:relative;width:100%;height:100%;min-height:100svh;overflow:hidden}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#top{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.resources,.help,#status{background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 28px #0003;backdrop-filter:blur(8px)}.brand{padding:10px 14px;border-radius:16px}.brand small{display:block;color:var(--gold);font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:.66rem}.brand strong{display:block;font-size:clamp(1.1rem,3vw,1.8rem);letter-spacing:.07em;text-transform:uppercase}
.resources{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding:8px;border-radius:14px}.pill{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-weight:800;font-size:.78rem;color:var(--muted);white-space:nowrap}.pill b{color:#fff;font-size:.95rem}
#status{position:absolute;z-index:2;top:clamp(86px,12vh,116px);left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));padding:9px 14px;border-radius:999px;text-align:center;font-weight:800;font-size:.9rem}.win{color:#caffd0!important;border-color:#79df81aa!important}
#bottom{position:absolute;z-index:2;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;gap:10px;pointer-events:none}.controls,.help{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px;box-shadow:0 10px 28px #0003;backdrop-filter:blur(8px)}.controls{display:flex;gap:7px;flex-wrap:wrap}.help{color:var(--muted);font-size:.78rem;font-weight:700;line-height:1.5}.help b{color:var(--gold)}button{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#ffffff12;color:#fff;font-weight:900;cursor:pointer;transition:.15s transform,.15s background}.controls button:hover{transform:translateY(-2px);background:#79d8ff2b}.controls button.active{background:linear-gradient(135deg,#79d8ff55,#ffd16633);border-color:#ffd166aa;box-shadow:0 0 0 2px #ffd16622}.fullscreen{background:#ffd16622!important;border-color:#ffd16688!important}
@media(max-width:720px){#top{align-items:start;flex-direction:column}.resources{justify-content:flex-start;max-width:100%}.brand{padding:7px 10px}.brand strong{font-size:1rem}#status{top:142px;font-size:.78rem}.help{display:none}#bottom{justify-content:center}.controls{justify-content:center;width:100%}.controls button{flex:1 1 auto;padding:10px 8px;font-size:.75rem}}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="IsraelCraft Negev Bloom game"></canvas>
<header id="top"><div class="brand"><small>🇮🇱 IsraelCraft</small><strong>Negev Bloom</strong></div><div class="resources"><span class="pill">🌳 <b id="wood">8</b></span><span class="pill">🪨 <b id="stone">7</b></span><span class="pill">🌾 <b id="wheat">5</b></span><span class="pill">💧 <b id="water">6</b></span><span class="pill">⚙️ <b id="iron">3</b></span></div></header>
<div id="status">Gather resources, then click the map to build your kibbutz!</div>
<footer id="bottom"><div class="controls"><button data-build="camp" class="active">⛺ Camp</button><button data-build="farm">🌾 Farm</button><button data-build="workshop">⚙️ Workshop</button><button data-build="well">💧 Well</button><button id="fullscreen" class="fullscreen">⛶ Fullscreen</button></div><div class="help"><b>WASD / arrows</b> move · <b>E / Space</b> gather · <b>F</b> turn · drag map to spin</div></footer>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status');
const W=22,H=16,TAU=Math.PI*2,ui={};['wood','stone','wheat','water','iron'].forEach(k=>ui[k]=document.getElementById(k));
const input={keys:{},pointer:null,drag:false,lastX:0};const state={yaw:.72,selected:'camp',won:false};
const player={x:3.5,y:3.5,speed:5,inventory:{wood:8,stone:7,wheat:5,water:6,iron:3}};const world={tiles:[],resources:[],buildings:[]};
const BUILD={camp:{name:'Camp',cost:{wood:5,stone:4,wheat:2}},farm:{name:'Farm',cost:{wood:6,stone:4,wheat:5,water:2}},workshop:{name:'Workshop',cost:{wood:9,stone:8,iron:4,water:2}},well:{name:'Well',cost:{wood:3,stone:5,water:3}}};
let view={w:innerWidth,h:innerHeight,dpr:1,tile:28};
const colors={grass:['#75c96b','#4d9e4b','#2f6d39','#9cdb75'],sand:['#f0d88d','#cdae61','#92743a','#f5e6a9'],rock:['#b8c3cc','#808b96','#4b5865','#d5dee4'],water:['#76d9f0','#3cadd5','#24638d','#b5efff']};
function say(t,win=false){statusEl.textContent=t;statusEl.classList.toggle('win',win)}
function resize(){view.w=innerWidth;view.h=innerHeight;view.dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(view.w*view.dpr);canvas.height=Math.floor(view.h*view.dpr);canvas.style.width=view.w+'px';canvas.style.height=view.h+'px';ctx.setTransform(view.dpr,0,0,view.dpr,0,0);view.tile=Math.max(13,Math.min(31,Math.min(view.w/(W+4),view.h/(H*.62+8))));draw()}
function makeWorld(){for(let y=0;y<H;y++){world.tiles[y]=[];for(let x=0;x<W;x++){let n=Math.sin(x*.72)+Math.cos(y*.78)+Math.sin((x+y)*.58),t=n<-1.3?'rock':x>15&&y>9?'sand':'grass';if((x>18&&y>10)||(x<2&&y>12))t='water';if(y<2||x<1||x>W-2)t='rock';world.tiles[y][x]=t}}const add=(type,count)=>{let n=0;while(n<count){let x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));if(world.tiles[y][x]==='water'||world.tiles[y][x]==='rock'||world.resources.some(r=>r.x===x&&r.y===y))continue;world.resources.push({x,y,type,amount:3+Math.floor(Math.random()*3)});n++}};add('tree',15);add('stone',11);add('wheat',12);add('water',8);add('iron',7)}
function update(){Object.keys(ui).forEach(k=>ui[k].textContent=player.inventory[k])}
function has(cost){return Object.entries(cost).every(([k,v])=>player.inventory[k]>=v)}
function near(){let best=null,dist=1.55;for(const r of world.resources){let d=Math.hypot(player.x-r.x-.5,player.y-r.y-.5);if(d<dist){best=r;dist=d}}return best}
function gather(){let r=near();if(!r){say('Walk closer to a resource, then press E or Space.');return}let key={tree:'wood',stone:'stone',wheat:'wheat',water:'water',iron:'iron'}[r.type],amount=2+Math.floor(Math.random()*2);player.inventory[key]+=amount;if(--r.amount<=0)world.resources=world.resources.filter(x=>x!==r);update();say(`+${amount} ${key}! Keep exploring.`)}
function place(x,y){let type=state.selected,d=BUILD[type];if(!has(d.cost)){say(`Need more resources for a ${d.name}.`);return}if(world.tiles[y]?.[x]==='water'||world.tiles[y]?.[x]==='rock'){say('Choose a sunny grass or sand tile.');return}if(world.buildings.some(b=>b.x===x&&b.y===y)){say('That tile is already occupied.');return}Object.entries(d.cost).forEach(([k,v])=>player.inventory[k]-=v);world.buildings.push({x,y,type});update();say(`${d.name} built! Nice work.`);checkWin()}
function checkWin(){if(!state.won&&['camp','farm','workshop','well'].every(t=>world.buildings.some(b=>b.type===t))){state.won=true;say('🎉 Victory! Your Negev kibbutz is blooming!',true)}}
function move(dt){let ax=(input.keys.KeyD||input.keys.ArrowRight?1:0)-(input.keys.KeyA||input.keys.ArrowLeft?1:0),ay=(input.keys.KeyS||input.keys.ArrowDown?1:0)-(input.keys.KeyW||input.keys.ArrowUp?1:0);if(!ax&&!ay)return;let l=Math.hypot(ax,ay),nx=Math.max(.5,Math.min(W-1.5,player.x+ax/l*player.speed*dt)),ny=Math.max(.5,Math.min(H-1.5,player.y+ay/l*player.speed*dt));if(!['water','rock'].includes(world.tiles[Math.floor(player.y)][Math.floor(nx)]))player.x=nx;if(!['water','rock'].includes(world.tiles[Math.floor(ny)][Math.floor(player.x)]))player.y=ny}
function project(x,y,z=0){let c=Math.cos(state.yaw),s=Math.sin(state.yaw),rx=x*c-y*s,ry=x*s+y*c;return{x:view.w/2+(rx-ry)*view.tile,y:view.h*.57+(rx+ry)*view.tile*.5-z*view.tile}}
function poly(points,fill,stroke='#0003'){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}
function cube(x,y,z,h,c){let p=project(x,y,z),q=project(x+1,y,z),r=project(x+1,y+1,z),s=project(x,y+1,z),a=project(x,y,z-h),b=project(x+1,y,z-h),d=project(x,y+1,z-h);poly([p,q,r,s],c[0]);poly([a,b,project(x+1,y+1,z-h),d],c[1]);poly([d,project(x+1,y+1,z-h),r,s],c[2]);poly([a,b,q,p],c[3])}
function drawResource(r){let c={tree:['#91e575','#4fb25e','#28743e','#b9f08c'],stone:['#d1d9df','#929da7','#596673','#eef4f7'],wheat:['#d7ef75','#83bd3d','#5d8c2d','#f1faac'],water:['#a2efff','#55c5eb','#2879a7','#d8fbff'],iron:['#e1e6ec','#969ca5','#5c626c','#fff']}[r.type];if(r.type==='tree'){cube(r.x+.18,r.y+.18,.25,.65,c);cube(r.x+.32,r.y+.32,.82,.5,c)}else cube(r.x+.18,r.y+.18,.2,.5,c)}
function drawBuilding(b){let c={camp:['#f8d18c','#c48749','#8b552d','#ffebbc'],farm:['#c5e88a','#82ad45','#537e2d','#eaffab'],workshop:['#dce8ef','#94a5b2','#596b79','#f6fbff'],well:['#a5edff','#50b8dc','#28617d','#e1fbff']}[b.type];cube(b.x+.1,b.y+.1,.25,.8,c)}
function tileAtPointer(){if(!input.pointer)return null;let best=null,bd=Infinity;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let p=project(x+.5,y+.5),d=Math.hypot(input.pointer.x-p.x,input.pointer.y-p.y);if(d<bd){bd=d;best={x,y}}}return bd<view.tile*1.35?best:null}
function draw(){ctx.clearRect(0,0,view.w,view.h);let sky=ctx.createLinearGradient(0,0,0,view.h);sky.addColorStop(0,'#70c8f0');sky.addColorStop(.55,'#c8efcf');sky.addColorStop(1,'#d9f1a8');ctx.fillStyle=sky;ctx.fillRect(0,0,view.w,view.h);ctx.fillStyle='#ffd166';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(view.w*.82,view.h*.18,Math.min(view.w,view.h)*.07,0,TAU);ctx.fill();ctx.globalAlpha=1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)cube(x,y,0,.34,colors[world.tiles[y][x]]);world.resources.forEach(drawResource);world.buildings.forEach(drawBuilding);let p=project(player.x,player.y);ctx.fillStyle='#f5d0a0';ctx.beginPath();ctx.arc(p.x,p.y-26,9,0,TAU);ctx.fill();cube(player.x-.18,player.y-.18,.25,.9,['#67b6ff','#347bd0','#1e4d9b','#a4d7ff']);let cell=tileAtPointer();if(cell){let c=world.tiles[cell.y][cell.x],ok=!['water','rock'].includes(c)&&!world.buildings.some(b=>b.x===cell.x&&b.y===cell.y)&&has(BUILD[state.selected].cost);poly([project(cell.x,cell.y,.25),project(cell.x+1,cell.y,.25),project(cell.x+1,cell.y+1,.25),project(cell.x,cell.y+1,.25)],ok?'#7dd3fc66':'#ff858555','#fff8')}}
function pointer(e){let r=canvas.getBoundingClientRect();input.pointer={x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointermove',e=>{pointer(e);if(input.drag){state.yaw+=(e.clientX-input.lastX)*.012;input.lastX=e.clientX;draw()}});canvas.addEventListener('pointerdown',e=>{pointer(e);input.drag=true;input.lastX=e.clientX;let c=tileAtPointer();if(c)place(c.x,c.y)});['pointerup','pointercancel','pointerleave'].forEach(type=>canvas.addEventListener(type,()=>input.drag=false));
addEventListener('keydown',e=>{input.keys[e.code]=true;if(!e.repeat&&(e.code==='KeyE'||e.code==='Space'))gather();if(!e.repeat&&e.code==='KeyF'){state.yaw+=Math.PI/2;draw()}});addEventListener('keyup',e=>input.keys[e.code]=false);addEventListener('resize',resize);
document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.build;document.querySelectorAll('[data-build]').forEach(x=>x.classList.toggle('active',x===b));say(`Selected ${BUILD[state.selected].name}. Click a clear tile to build.`)});
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
makeWorld();update();resize();let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
