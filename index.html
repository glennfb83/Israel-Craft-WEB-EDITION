<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IsraelCraft</title>
<style>
:root{--panel:#182536ee;--line:#d9f0ff66;--ink:#f7fbff;--gold:#ffd166}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#162536;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{position:relative}canvas{display:block}#game{width:100%;height:100%}#top,#bottom{position:fixed;left:0;right:0;display:flex;pointer-events:none;justify-content:space-between;z-index:10;padding:12px 16px}#top{top:0}#bottom{bottom:0;justify-content:center}#top .panel,#bottom .panel,#status,#dialog{pointer-events:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 24px rgba(0,0,0,.24);backdrop-filter:blur(6px)}.brand{display:flex;flex-direction:column;padding:8px 12px;line-height:1.1}.brand small{opacity:.8}.brand strong{font-size:1.1rem}.controls{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,42px);gap:8px;padding:8px}.controls button{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1.1rem;cursor:pointer}.controls .up{grid-column:2;grid-row:1}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}#status{position:fixed;left:50%;top:12px;transform:translateX(-50%);padding:10px 16px;font-size:.9rem;z-index:12;background:var(--panel);border:1px solid var(--line);border-radius:999px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dialog{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);width:min(460px,calc(100% - 24px));display:none;z-index:20;padding:10px 12px}#dialog.open{display:block}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}.dialog-head button{background:transparent;border:none;color:var(--ink);font-size:1.4rem;cursor:pointer;line-height:1}.dialog-text{line-height:1.45;color:#edf6ff}.#minimap{position:fixed;right:18px;top:18px;width:150px;height:150px;border:1px solid var(--line);background:rgba(12,18,20,.45);border-radius:10px;z-index:12;box-shadow:0 12px 22px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="IsraelCraft village game"></canvas>
<header id="top"><div class="panel brand"><small>⛏️ IsraelCraft</small><strong>NPC Village</strong></div></header>
<canvas id="minimap" width="150" height="150" aria-label="Village minimap"></canvas>
<div id="status" class="panel">WASD / arrows move · drag to look · E or Space talks</div>
<div id="dialog" class="panel"><div class="dialog-head"><span id="dialog-name"></span><button id="close-dialog" aria-label="Close dialog">×</button></div><div class="dialog-text" id="dialog-text"></div></div>
<footer id="bottom"><div class="panel controls"><button class="up" data-move="up" aria-label="Move forward">▲</button><button class="left" data-move="left" aria-label="Move left">◀</button><button class="down" data-move="down" aria-label="Move back">▼</button><button class="right" data-move="right" aria-label="Move right">▶</button></div></footer>
</div>
<script>
(() => {'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('minimap');
const mctx = mini.getContext('2d');
const status = document.getElementById('status');
const dialog = document.getElementById('dialog');
const keys = Object.create(null);
const world = {
  size: 32,
  tiles: [],
  npcs: [
    { name: 'Flippy', x: 6.5, y: 6.5, line: 'Going flippy? To be frank, happens to the best of us.' },
    { name: 'Frank', x: 11.5, y: 11.5, line: 'The village is quiet when the wind is kind.' },
    { name: 'Mira', x: 15.5, y: 9.5, line: 'The herbs grow strongest near the morning sun.' },
    { name: 'Rafi', x: 20.5, y: 12.5, line: 'I hear the market gets louder before sunset.' },
    { name: 'Nina', x: 23.5, y: 18.5, line: 'The path is safest when you take it slowly.' },
    { name: 'Yosef', x: 8.5, y: 23.5, line: 'A calm mind makes for a better trip through town.' },
    { name: 'Ariel', x: 13.5, y: 25.5, line: 'The trees keep the place cool and the stories alive.' },
    { name: 'Lena', x: 18.5, y: 23.5, line: 'Every visitor deserves a warm welcome here.' },
    { name: 'Gabi', x: 25.5, y: 25.5, line: 'You can tell a lot from a good evening breeze.' },
    { name: 'Dani', x: 27.5, y: 8.5, line: 'If you keep moving, the village feels bigger each time.' },
    { name: 'Shira', x: 5.5, y: 18.5, line: 'I love watching the lanterns glow after dusk.' },
    { name: 'Noam', x: 22.5, y: 5.5, line: 'The best route is always the one with the most shade.' },
    { name: 'Tal', x: 9.5, y: 14.5, line: 'The old oak still stands longer than any rumor.' },
    { name: 'Ilan', x: 18.5, y: 17.5, line: 'There is always time for one more friendly hello.' },
    { name: 'Sara', x: 29.5, y: 29.5, line: 'The village feels most alive when people stop to talk.' }
  ]
};
const player = { x: 16.5, y: 16.5, r: 0.34, speed: 4.8, angle: 0 };
let view = { w: innerWidth, h: innerHeight, dpr: 1 };
let looking = false;
let lastLookX = 0;

function resize(){
  view.w = innerWidth;
  view.h = innerHeight;
  view.dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = view.w * view.dpr;
  canvas.height = view.h * view.dpr;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
}

function makeWorld(){
  world.tiles = Array.from({ length: world.size }, () => Array(world.size).fill('grass'));
  const trees = [
    [3,3],[4,8],[7,5],[10,12],[13,6],[16,9],[20,14],[23,7],[27,11],[24,21],[11,23],[6,19],[15,25],[18,28],[8,28],[4,22],[12,16],[20,19],[23,27],[27,20],
    [2,12],[2,26],[5,29],[9,19],[14,13],[19,21],[21,26],[28,15],[29,24],[26,4],[17,4],[8,8],[12,27],[24,12]
  ];
  for (const [x, y] of trees) {
    if (x > 0 && x < world.size - 1 && y > 0 && y < world.size - 1) {
      world.tiles[y][x] = 'tree';
    }
  }
}

function blocked(x, y){
  const tx = Math.floor(x);
  const ty = Math.floor(y);
  const tile = world.tiles[ty]?.[tx];
  return !tile || tile === 'tree' || tile === 'water';
}

function canStand(x, y){
  const r = player.r;
  return !blocked(x - r, y - r) && !blocked(x + r, y - r) && !blocked(x - r, y + r) && !blocked(x + r, y + r);
}

function nearest(){
  let best = null;
  let bestDist = 2.2;
  for (const npc of world.npcs) {
    const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
    if (dist < bestDist) {
      bestDist = dist;
      best = npc;
    }
  }
  return best;
}

function talk(){
  const npc = nearest();
  if (!npc) {
    status.textContent = 'Move closer to an NPC to talk.';
    return;
  }
  document.getElementById('dialog-name').textContent = npc.name;
  document.getElementById('dialog-text').textContent = npc.line;
  dialog.classList.add('open');
}

function key(e, down){
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key)) e.preventDefault();
  keys[e.code] = down;
  if (down && e.code === 'Space') talk();
}

function move(dt){
  if (keys.KeyQ) player.angle -= 2.5 * dt;
  if (keys.KeyE) player.angle += 2.5 * dt;

  const forward = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

  if (!forward && !strafe) return;

  const cos = Math.cos(player.angle);
  const sin = Math.sin(player.angle);
  const rightX = Math.cos(player.angle + Math.PI / 2);
  const rightY = Math.sin(player.angle + Math.PI / 2);
  const moveX = cos * forward + rightX * strafe;
  const moveY = sin * forward + rightY * strafe;
  const len = Math.hypot(moveX, moveY) || 1;
  const dx = (moveX / len) * player.speed * dt;
  const dy = (moveY / len) * player.speed * dt;

  const testX = player.x + dx;
  const testY = player.y + dy;

  if (canStand(testX, player.y)) player.x = testX;
  if (canStand(player.x, testY)) player.y = testY;
}

function tileAt(x, y){
  if (x < 0 || y < 0 || x >= world.size || y >= world.size) return 'grass';
  return world.tiles[Math.floor(y)]?.[Math.floor(x)] || 'grass';
}

function drawMini(){
  const m = mini.width / world.size;
  mctx.clearRect(0, 0, mini.width, mini.height);
  for (let y = 0; y < world.size; y++) {
    for (let x = 0; x < world.size; x++) {
      const tile = tileAt(x, y);
      const color = tile === 'tree' ? '#2f5d2d' : '#5b9b4a';
      mctx.fillStyle = color;
      mctx.fillRect(x * m, y * m, m, m);
    }
  }
  for (const npc of world.npcs) {
    mctx.fillStyle = '#ffd166';
    mctx.fillRect(npc.x * m - 1.5, npc.y * m - 1.5, 3, 3);
  }
  mctx.fillStyle = '#f4f6ff';
  mctx.fillRect(player.x * m - 2, player.y * m - 2, 4, 4);
}

function draw(){
  ctx.clearRect(0, 0, view.w, view.h);
  const w = view.w;
  const h = view.h;
  ctx.fillStyle = '#7dc271';
  ctx.fillRect(0, 0, w, h);

  const scale = 32;
  const offsetX = w * 0.5;
  const offsetY = h * 0.5;

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.rotate(-player.angle);
  ctx.translate(-player.x * scale, -player.y * scale);

  for (let y = 0; y < world.size; y++) {
    for (let x = 0; x < world.size; x++) {
      const tile = tileAt(x, y);
      const px = x * scale;
      const py = y * scale;
      ctx.fillStyle = tile === 'tree' ? '#32592f' : '#5ca052';
      ctx.fillRect(px, py, scale, scale);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.strokeRect(px + 0.5, py + 0.5, scale - 1, scale - 1);
    }
  }

  for (const npc of world.npcs) {
    const px = npc.x * scale;
    const py = npc.y * scale;
    ctx.fillStyle = '#f6d688';
    ctx.beginPath();
    ctx.arc(px + scale * 0.5, py + scale * 0.5, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2c3a4b';
    ctx.fillRect(px + scale * 0.35, py + scale * 0.1, scale * 0.3, scale * 0.2);
  }

  for (const [x, y] of [
    [3,3],[4,8],[7,5],[10,12],[13,6],[16,9],[20,14],[23,7],[27,11],[24,21],[11,23],[6,19],[15,25],[18,28],[8,28],[4,22],[12,16],[20,19],[23,27],[27,20],
    [2,12],[2,26],[5,29],[9,19],[14,13],[19,21],[21,26],[28,15],[29,24],[26,4],[17,4],[8,8],[12,27],[24,12]
  ]) {
    const px = x * scale;
    const py = y * scale;
    ctx.fillStyle = '#3f6f39';
    ctx.beginPath();
    ctx.arc(px + scale * 0.5, py + scale * 0.5, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6d4b2a';
    ctx.fillRect(px + scale * 0.44, py + scale * 0.15, 5, scale * 0.7);
  }

  ctx.restore();

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.rotate(player.angle);
  ctx.fillStyle = '#f5f7ff';
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-10, -8);
  ctx.lineTo(-4, 0);
  ctx.lineTo(-10, 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const npc = nearest();
  if (npc) {
    const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
    status.textContent = dist < 1.8 ? 'E or Space talks to ' + npc.name : 'WASD / arrows move · drag to look · E or Space talks';
  } else {
    status.textContent = 'WASD / arrows move · drag to look · E or Space talks';
  }
}

addEventListener('keydown', e => key(e, true));
addEventListener('keyup', e => key(e, false));

const directions = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
document.querySelectorAll('[data-move]').forEach(button => {
  const code = directions[button.dataset.move];
  const press = e => {
    if (e) e.preventDefault();
    keys[code] = true;
    if (button.dataset.move === 'up') keys.KeyW = true;
    if (button.dataset.move === 'down') keys.KeyS = true;
    if (button.dataset.move === 'left') keys.KeyA = true;
    if (button.dataset.move === 'right') keys.KeyD = true;
  };
  const release = e => {
    if (e) e.preventDefault();
    keys[code] = false;
    if (button.dataset.move === 'up') keys.KeyW = false;
    if (button.dataset.move === 'down') keys.KeyS = false;
    if (button.dataset.move === 'left') keys.KeyA = false;
    if (button.dataset.move === 'right') keys.KeyD = false;
  };
  button.addEventListener('pointerdown', press);
  button.addEventListener('pointerup', release);
  button.addEventListener('pointerleave', release);
  button.addEventListener('pointercancel', release);
});

canvas.addEventListener('pointerdown', e => {
  looking = true;
  lastLookX = e.clientX;
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!looking) return;
  const dx = e.clientX - lastLookX;
  player.angle += dx * 0.006;
  lastLookX = e.clientX;
});

canvas.addEventListener('pointerup', () => looking = false);
canvas.addEventListener('pointerleave', () => looking = false);

document.getElementById('close-dialog').addEventListener('click', () => dialog.classList.remove('open'));

makeWorld();
resize();
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  move(dt);
  draw();
  drawMini();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('resize', resize);
})();
</script>
</body>
</html>
