<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IsraelCraft 3D</title>
<style>
:root{--panel:#0b1726e8;--line:#ffffff38;--ink:#f7fbff;--gold:#ffd166}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#162536;color:var(--ink);font:14px system-ui,sans-serif}#game{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}.panel{background:linear-gradient(145deg,#13243af2,#07111eef);border:1px solid var(--line);box-shadow:0 8px 27px #0007;backdrop-filter:blur(8px);border-radius:14px}#top{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}.brand{padding:8px 12px}.brand small,.brand strong{display:block}.brand strong{font-size:18px}.resources{padding:8px 12px;display:flex;gap:8px}.pill{padding:5px 8px;border-radius:9px;background:#ffffff12}.controls{display:flex;align-items:center;gap:10px;padding:10px;pointer-events:auto}.move-pad{width:118px;height:92px;display:grid;grid-template:repeat(3,30px)/repeat(3,36px);justify-content:center;align-content:center}.move-pad button{color:#fff;background:#ffffff18;border:1px solid #ffffff35;border-radius:8px;font-size:17px;touch-action:none}.up{grid-area:1/2}.left{grid-area:2/1}.down{grid-area:2/2}.right{grid-area:2/3}button{color:#fff;background:#ffffff18;border:1px solid #ffffff35;border-radius:9px;padding:10px;cursor:pointer}.help{padding:10px;line-height:1.45}#bottom{position:fixed;z-index:2;bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:end;gap:10px;pointer-events:none}#status{position:fixed;z-index:2;top:76px;left:50%;transform:translateX(-50%);padding:8px 12px;text-align:center;pointer-events:none;max-width:calc(100% - 24px)}#dialog{display:none;position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));padding:14px}.dialog-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}.dialog-head button{font-size:24px;background:none;border:0;padding:0}.dialog-text{margin-top:10px;line-height:1.5}@media(max-width:650px){.help{display:none}.resources{display:none}}
</style>
</head>
<body><div id="app">
<canvas id="game" aria-label="IsraelCraft 3D village game"></canvas>
<header id="top"><div class="panel brand"><small>⛏️ IsraelCraft</small><strong>3D NPC Village</strong></div><div class="panel resources"><span class="pill">🪵 <b id="wood">8</b></span><span class="pill">🪨 <b id="stone">7</b></span><span class="pill">🌾 <b id="wheat">5</b></span></div></header>
<div id="status" class="panel">WASD / arrows move · drag to look · E or Space talks</div>
<div id="dialog" class="panel"><div class="dialog-head"><span id="dialog-name"></span><button id="close-dialog">×</button></div><div class="dialog-text" id="dialog-text"></div></div>
<footer id="bottom"><div class="panel controls"><div class="move-pad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><button id="talk">💬 Talk</button><button id="fullscreen">⛶ Fullscreen</button></div><div class="panel help"><b>Move:</b> WASD / arrows<br><b>Talk:</b> E, Space, or button</div></footer>
</div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),dialog=document.getElementById('dialog'),keys=Object.create(null);const world={size:32,tiles:[],npcs:[{name:'Flippy',x:8,y:8,line:'Going flippy? To be frank, happens to the best of us.'},{name:'Frank',x:24,y:13,line:'The village is quiet when the wind is kind.'},{name:'Maya',x:16,y:24,line:'Welcome to IsraelCraft! The whole map is yours to explore.'},{name:'Rafi',x:20,y:12,line:'The market gets louder before sunset.'},{name:'Nina',x:23,y:19,line:'The path is safest when you take it slowly.'}]};const player={x:16.5,y:16.5,r:.27,speed:4.8,angle:0};let view={w:innerWidth,h:innerHeight,dpr:1},looking=false,lastX=0;
function resize(){view.w=innerWidth;view.h=innerHeight;view.dpr=Math.min(devicePixelRatio||1,2);canvas.width=view.w*view.dpr;canvas.height=view.h*view.dpr;ctx.setTransform(view.dpr,0,0,view.dpr,0,0)}
function makeWorld(){for(let y=0;y<world.size;y++){world.tiles[y]=[];for(let x=0;x<world.size;x++){const edge=x<1||y<1||x>=world.size-1||y>=world.size-1,n=Math.sin(x*.7)+Math.cos(y*.55)+Math.sin((x+y)*.3);world.tiles[y][x]=edge?'water':n<-1.25?'rock':n>1.35?'sand':'grass'}}for(const n of world.npcs)world.tiles[n.y][n.x]='grass';world.tiles[16][16]='grass'}
function tileAt(x,y){return world.tiles[Math.floor(y)]?.[Math.floor(x)]||'rock'}function blocked(x,y){const t=tileAt(x,y);return t==='water'||t==='rock'}function canStand(x,y){const r=player.r;return !blocked(x-r,y-r)&&!blocked(x+r,y-r)&&!blocked(x-r,y+r)&&!blocked(x+r,y+r)}
function move(dt){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(!f&&!s)return;const len=Math.hypot(f,s)||1,dx=Math.cos(player.angle)*f/len*player.speed*dt-Math.sin(player.angle)*s/len*player.speed*dt,dy=Math.sin(player.angle)*f/len*player.speed*dt+Math.cos(player.angle)*s/len*player.speed*dt;if(canStand(player.x+dx,player.y))player.x+=dx;if(canStand(player.x,player.y+dy))player.y+=dy}
function nearest(){let best=null,d=2.2;for(const n of world.npcs){const q=Math.hypot(player.x-n.x,player.y-n.y);if(q<d){d=q;best=n}}return best}function talk(){const n=nearest();if(!n){status.textContent='Move closer to an NPC to talk.';return}document.getElementById('dialog-name').textContent=n.name;document.getElementById('dialog-text').textContent=n.line;dialog.style.display='block'}
function draw(){const w=view.w,h=view.h,horizon=h*.43;const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#6eb7df');sky.addColorStop(1,'#d6c28d');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);ctx.fillStyle='#5a8f48';ctx.fillRect(0,horizon,w,h-horizon);const fov=Math.PI/3,rays=Math.ceil(w),strip=w/rays;for(let i=0;i<rays;i++){const cam=(i/rays-.5)*fov,ang=player.angle+cam,dx=Math.cos(ang),dy=Math.sin(ang);let d=0,hit='grass';while(d<30){d+=.035;const t=tileAt(player.x+dx*d,player.y+dy*d);if(t==='water'||t==='rock'||t==='sand'){hit=t;break}}const corrected=d*Math.cos(cam),wall=Math.min(h*2,h/(corrected*.72)),top=horizon-wall/2;ctx.fillStyle={rock:'#657482',sand:'#d2b367',water:'#3696bd',grass:'#3cad55'}[hit];ctx.fillRect(i*strip,top,strip+1,wall);ctx.fillStyle='rgba(0,0,0,'+Math.min(.65,corrected/30)+')';ctx.fillRect(i*strip,top,strip+1,wall)}ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';for(const n of world.npcs){const vx=n.x+.5-player.x,vy=n.y+.5-player.y,dist=Math.hypot(vx,vy),rel=Math.atan2(vy,vx)-player.angle;if(Math.abs(Math.atan2(Math.sin(rel),Math.cos(rel)))<fov*.55&&dist>.3){const sx=w/2+Math.tan(rel)/(Math.tan(fov/2))*w/2,size=Math.min(h*.45,h/(dist*.8));ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(sx,horizon+size*.08,size*.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7b4b32';ctx.fillRect(sx-size*.13,horizon+size*.2,size*.26,size*.4);ctx.fillStyle='#fff';ctx.fillText(n.name,sx,horizon-size*.15)}}ctx.fillStyle='#fff';ctx.fillRect(w/2-7,horizon-1,14,2);const n=nearest();status.textContent=n?'E or Space talks to '+n.name:'WASD / arrows move · drag to look · E or Space talks'}
function key(e,down){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key))e.preventDefault();keys[e.code]=down;if(down&&(e.code==='KeyE'||e.code==='Space'))talk()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));const dirs={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};document.querySelectorAll('[data-move]').forEach(b=>{const c=dirs[b.dataset.move],set=v=>e=>{e.preventDefault();keys[c]=v};b.addEventListener('pointerdown',set(true));['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,set(false)))});canvas.addEventListener('pointerdown',e=>{looking=true;lastX=e.clientX;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(looking){player.angle+=(e.clientX-lastX)*.006;lastX=e.clientX}});['pointerup','pointerleave','pointercancel'].forEach(x=>canvas.addEventListener(x,()=>looking=false));document.getElementById('talk').onclick=talk;document.getElementById('close-dialog').onclick=()=>dialog.style.display='none';document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();makeWorld();resize();addEventListener('resize',resize);let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
