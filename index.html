<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BlockCraft: NPC Village</title>
<style>
:root{--ink:#f7fbff;--muted:#dcecff;--line:#ffffff35;--panel:#0c1625e8;--gold:#ffd166;--blue:#79dcff;--green:#7bea88}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172235;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{position:relative;width:100%;height:100%;min-height:100svh;overflow:hidden}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.panel{background:linear-gradient(145deg,#13243aeF,#07111eeF);border:1px solid var(--line);box-shadow:0 10px 30px #0006;backdrop-filter:blur(10px)}#top{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}.brand{padding:9px 14px;border-radius:15px}.brand small{display:block;color:var(--gold);font-size:.65rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.brand strong{display:block;font-size:clamp(1.05rem,3vw,1.7rem);letter-spacing:.06em}.resources{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding:7px;border-radius:14px}.pill{padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.78rem;font-weight:800;white-space:nowrap}.pill b{color:#fff;font-size:.95rem}
#status{position:absolute;z-index:3;top:clamp(82px,12vh,112px);left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));padding:9px 14px;border-radius:999px;text-align:center;font-size:.86rem;font-weight:800;pointer-events:none}.win{color:#caffd0!important;border-color:#7bea88aa!important}
#bottom{position:absolute;z-index:3;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}.controls,.help{pointer-events:auto;border-radius:15px;padding:9px}.controls{display:flex;gap:7px;flex-wrap:wrap}.help{color:var(--muted);font-size:.78rem;font-weight:700;line-height:1.45}.help b{color:var(--gold)}button{border:1px solid var(--line);border-radius:10px;background:#ffffff12;color:#fff;padding:9px 11px;font-weight:900;cursor:pointer;touch-action:manipulation}button:hover{background:#79dcff30}button.active{background:linear-gradient(135deg,#79dcff55,#ffd16635);border-color:#ffd166aa}.full{background:#ffd16625!important}.move-pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:5px}.move-pad button{padding:0;font-size:1.1rem}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
#dialog{display:none;position:absolute;z-index:4;left:50%;bottom:clamp(105px,17vh,150px);transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:15px 17px;border-radius:17px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-name{color:var(--gold);font-weight:900;font-size:1.05rem}.dialog-text{margin-top:6px;color:var(--muted);line-height:1.4}#close-dialog{padding:3px 9px}
@media(max-width:720px){#top{flex-direction:column}.resources{justify-content:flex-start}.brand{padding:7px 10px}.brand strong{font-size:1rem}#status{top:140px;font-size:.76rem}.help{display:none}#bottom{justify-content:center;flex-wrap:wrap}.controls{width:100%;justify-content:center}.controls button{flex:1 1 auto;padding:10px 7px;font-size:.73rem}.move-pad{display:grid}.dialog-name{font-size:.95rem}}
</style>
</head>
<body><div id="app">
<canvas id="game" aria-label="BlockCraft village game"></canvas>
<header id="top"><div class="panel brand"><small>⛏️ BlockCraft</small><strong>NPC Village</strong></div><div class="panel resources"><span class="pill">🪵 <b id="wood">8</b></span><span class="pill">🪨 <b id="stone">7</b></span><span class="pill">🌾 <b id="wheat">5</b></span><span class="pill">💧 <b id="water">6</b></span><span class="pill">⚙️ <b id="iron">3</b></span></div></header>
<div id="status" class="panel">Use the arrow buttons or WASD to move. Walk near a block and press Gather.</div>
<div id="dialog" class="panel"><div class="dialog-head"><div class="dialog-name" id="dialog-name"></div><button id="close-dialog">×</button></div><div class="dialog-text" id="dialog-text"></div></div>
<footer id="bottom"><div class="panel controls"><div class="move-pad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="right" data-move="right">▶</button></div><button id="gather">✋ Gather / Talk</button><button data-build="camp" class="active">⛺ Camp</button><button data-build="farm">🌾 Farm</button><button data-build="workshop">⚙️ Workshop</button><button data-build="well">💧 Well</button><button id="fullscreen" class="full">⛶ Fullscreen</button></div><div class="panel help"><b>Move:</b> WASD / arrows or buttons<br><b>Gather/Talk:</b> E, Space, or button<br><b>Build:</b> choose a button, then click a tile</div></footer>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),dialog=document.getElementById('dialog'),dialogName=document.getElementById('dialog-name'),dialogText=document.getElementById('dialog-text');
const W=22,H=16,TAU=Math.PI*2,ui={};['wood','stone','wheat','water','iron'].forEach(k=>ui[k]=document.getElementById(k));const input={keys:Object.create(null),moveTimer:null,pointer:null};const state={yaw:.72,selected:'camp',won:false};const player={x:3.5,y:3.5,speed:5,inventory:{wood:8,stone:7,wheat:5,water:6,iron:3}};const world={tiles:[],resources:[],buildings:[],npcs:[]};
const BUILD={camp:{name:'Camp',cost:{wood:5,stone:4,wheat:2}},farm:{name:'Farm',cost:{wood:6,stone:4,wheat:5,water:2}},workshop:{name:'Workshop',cost:{wood:9,stone:8,iron:4,water:2}},well:{name:'Well',cost:{wood:3,stone:5,water:3}}};const npcNames=['goon_king69','margit_the_f3ll','Pierson562','Big P','cling','GlennFB','flippy francis'];const npcLines=['The village needs a few more blocks!','I found a great spot for a farm.','Have you seen the iron nearby?','This place is going to be huge.','Keep exploring; the map is bigger than it looks.','Nice build! You are doing great.','Let us make this village legendary!'];let view={w:innerWidth,h:innerHeight,dpr:1,tile:20};
const colors={grass:['#8ed46d','#54a74d','#326f3c','#d1f39a'],sand:['#e1c47b','#b89450','#76572f','#f5dfa1'],rock:['#c5d0da','#8794a1','#4c5b6a','#eef4f8'],water:['#8be5f7','#43aed3','#205c89','#d5fbff']};
function say(t,win=false){statusEl.textContent=t;statusEl.classList.toggle('win',win)}function update(){Object.keys(ui).forEach(k=>ui[k].textContent=player.inventory[k])}function has(c){return Object.entries(c).every(([k,v])=>player.inventory[k]>=v)}
function resize(){view.w=innerWidth;view.h=innerHeight;view.dpr=Math.min(devicePixelRatio||1,2);canvas.width=view.w*view.dpr;canvas.height=view.h*view.dpr;canvas.style.width=view.w+'px';canvas.style.height=view.h+'px';ctx.setTransform(view.dpr,0,0,view.dpr,0,0);view.tile=Math.max(11,Math.min(25,Math.min(view.w/(W*1.62),view.h/(H*.9))));draw()}
function makeWorld(){for(let y=0;y<H;y++){world.tiles[y]=[];for(let x=0;x<W;x++){let n=Math.sin(x*.72)+Math.cos(y*.78)+Math.sin((x+y)*.58),t=n<-1.3?'rock':x>15&&y>9?'sand':'grass';if((x>18&&y>10)||(x<2&&y>12))t='water';if(y<2||x<1||x>W-2)t='rock';world.tiles[y][x]=t}}const add=(type,count)=>{let n=0;while(n<count){let x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));if(world.tiles[y][x]==='water'||world.tiles[y][x]==='rock'||world.resources.some(r=>r.x===x&&r.y===y))continue;world.resources.push({x,y,type,amount:3+Math.floor(Math.random()*3)});n++}};add('tree',15);add('stone',11);add('wheat',12);add('water',8);add('iron',7);world.npcs=npcNames.map((name,i)=>({name,x:4+(i*3)%15,y:3+Math.floor(i/3)*4,line:npcLines[i]}))}
function nearResource(){let best=null,d=1.55;for(const r of world.resources){let n=Math.hypot(player.x-r.x-.5,player.y-r.y-.5);if(n<d){best=r;d=n}}return best}function nearNpc(){let best=null,d=1.7;for(const n of world.npcs){let q=Math.hypot(player.x-n.x-.5,player.y-n.y-.5);if(q<d){best=n;d=q}}return best}function talk(n){dialogName.textContent=n.name;dialogText.textContent=n.line;dialog.style.display='block';say('Talking to '+n.name+'.')}function gather(){const n=nearNpc();if(n){talk(n);return}const r=nearResource();if(!r){say('Walk closer to a block or NPC first.');return}const key={tree:'wood',stone:'stone',wheat:'wheat',water:'water',iron:'iron'}[r.type],amount=2+Math.floor(Math.random()*2);player.inventory[key]+=amount;if(--r.amount<=0)world.resources=world.resources.filter(x=>x!==r);update();say('+'+amount+' '+key+'!')}
function place(x,y){const type=state.selected,d=BUILD[type];if(!has(d.cost)){say('Need more resources for a '+d.name+'.');return}if(world.tiles[y]?.[x]==='water'||world.tiles[y]?.[x]==='rock'){say('Choose a clear grass or sand tile.');return}if(world.buildings.some(b=>b.x===x&&b.y===y)||world.npcs.some(n=>Math.floor(n.x)===x&&Math.floor(n.y)===y)){say('That tile is occupied.');return}Object.entries(d.cost).forEach(([k,v])=>player.inventory[k]-=v);world.buildings.push({x,y,type});update();say(d.name+' built!');if(['camp','farm','workshop','well'].every(t=>world.buildings.some(b=>b.type===t))){state.won=true;say('🎉 Victory! Your block village is complete!',true)}}
function move(dt){let ax=(input.keys.KeyD||input.keys.ArrowRight?1:0)-(input.keys.KeyA||input.keys.ArrowLeft?1:0),ay=(input.keys.KeyS||input.keys.ArrowDown?1:0)-(input.keys.KeyW||input.keys.ArrowUp?1:0);if(!ax&&!ay)return;const l=Math.hypot(ax,ay),nx=Math.max(.5,Math.min(W-1.5,player.x+ax/l*player.speed*dt)),ny=Math.max(.5,Math.min(H-1.5,player.y+ay/l*player.speed*dt));if(!['water','rock'].includes(world.tiles[Math.floor(player.y)][Math.floor(nx)]))player.x=nx;if(!['water','rock'].includes(world.tiles[Math.floor(ny)][Math.floor(player.x)]))player.y=ny}
function project(x,y,z=0){const c=Math.cos(state.yaw),s=Math.sin(state.yaw),rx=x*c-y*s,ry=x*s+y*c;return{x:view.w/2+(rx-ry)*view.tile,y:view.h*.53+(rx+ry)*view.tile*.43-z*view.tile}}function poly(p,fill,stroke='#0004'){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}function cube(x,y,z,h,c){const p=project(x,y,z),q=project(x+1,y,z),r=project(x+1,y+1,z),s=project(x,y+1,z),a=project(x,y,z-h),b=project(x+1,y,z-h),d=project(x,y+1,z-h),e=project(x+1,y+1,z-h);poly([p,q,r,s],c[0]);poly([a,b,e,d],c[1]);poly([d,e,r,s],c[2]);poly([a,b,q,p],c[3])}
function drawResource(r){const c={tree:['#99ec7d','#4fb25e','#28743e','#c6f6a0'],stone:['#e0e7ed','#929da7','#596673','#fff'],wheat:['#e7f58b','#83bd3d','#5d8c2d','#fff2aa'],water:['#b2f4ff','#55c5eb','#2879a7','#e4ffff'],iron:['#edf2f6','#969ca5','#5c626c','#fff']}[r.type];if(r.type==='tree'){cube(r.x+.18,r.y+.18,.25,.65,c);cube(r.x+.32,r.y+.32,.82,.5,c)}else cube(r.x+.18,r.y+.18,.2,.5,c)}function drawBuilding(b){const c={camp:['#ffe0a2','#c48749','#8b552d','#fff1c7'],farm:['#d2f39b','#82ad45','#537e2d','#efffb8'],workshop:['#e9f4fb','#94a5b2','#596b79','#fff'],well:['#b8f5ff','#50b8dc','#28617d','#efffff']}[b.type];cube(b.x+.1,b.y+.1,.25,.8,c)}function drawNpc(n){const p=project(n.x+.5,n.y+.5),i=npcNames.indexOf(n.name);ctx.fillStyle='#f3c39a';ctx.fillRect(p.x-6,p.y-24,12,12);ctx.fillStyle=['#e87555','#7d8cff','#d86cc5','#f0bd55','#53c7a6','#c9d2dc','#f28bca'][i];ctx.fillRect(p.x-9,p.y-12,18,19);ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(n.name,p.x,p.y-31);if(nearNpc()===n){ctx.fillStyle='#ffd166';ctx.font='bold 15px system-ui';ctx.fillText('E',p.x,p.y-43)}}
function tileAtPointer(){if(!input.pointer)return null;let best=null,bd=Infinity;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=project(x+.5,y+.5),d=Math.hypot(input.pointer.x-p.x,input.pointer.y-p.y);if(d<bd){bd=d;best={x,y}}}return bd<view.tile*1.45?best:null}
function draw(){const sky=ctx.createLinearGradient(0,0,0,view.h);sky.addColorStop(0,'#68b9ed');sky.addColorStop(.52,'#b4e3d0');sky.addColorStop(1,'#263d2d');ctx.fillStyle=sky;ctx.fillRect(0,0,view.w,view.h);ctx.fillStyle='#fff0ad';ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(view.w*.82,view.h*.18,Math.min(view.w,view.h)*.06,0,TAU);ctx.fill();ctx.globalAlpha=1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)cube(x,y,0,.34,colors[world.tiles[y][x]]);world.resources.forEach(drawResource);world.buildings.forEach(drawBuilding);world.npcs.forEach(drawNpc);const p=project(player.x,player.y);ctx.fillStyle='#f5d0a0';ctx.beginPath();ctx.arc(p.x,p.y-26,9,0,TAU);ctx.fill();cube(player.x-.18,player.y-.18,.25,.9,['#79c4ff','#347bd0','#1e4d9b','#c0e5ff']);const cell=tileAtPointer();if(cell){const ok=!['water','rock'].includes(world.tiles[cell.y][cell.x])&&!world.buildings.some(b=>b.x===cell.x&&b.y===cell.y)&&has(BUILD[state.selected].cost);poly([project(cell.x,cell.y,.25),project(cell.x+1,cell.y,.25),project(cell.x+1,cell.y+1,.25),project(cell.x,cell.y+1,.25)],ok?'#7dd3fc66':'#ff858555','#fff8')}}
function pointer(e){const r=canvas.getBoundingClientRect();input.pointer={x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{pointer(e);const n=nearNpc();if(n&&Math.hypot(player.x-n.x-.5,player.y-n.y-.5)<1.7)talk(n);else{const c=tileAtPointer();if(c)place(c.x,c.y)}});addEventListener('keydown',e=>{input.keys[e.code]=true;if(!e.repeat&&(e.code==='KeyE'||e.code==='Space'))gather()});addEventListener('keyup',e=>input.keys[e.code]=false);addEventListener('resize',resize);
document.getElementById('gather').onclick=gather;document.querySelectorAll('[data-move]').forEach(b=>{const dir=b.dataset.move;const start=()=>{input.keys[{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[dir]]=true};const stop=()=>{input.keys.ArrowUp=input.keys.ArrowDown=input.keys.ArrowLeft=input.keys.ArrowRight=false};b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)});document.getElementById('close-dialog').onclick=()=>dialog.style.display='none';document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.build;document.querySelectorAll('[data-build]').forEach(x=>x.classList.toggle('active',x===b));say('Selected '+BUILD[state.selected].name+'. Click a clear tile to build.')});document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
makeWorld();update();resize();let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
